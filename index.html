<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Once Human</title>
<style>
:root {
  --bg: #07090d;
  --panel: #101820;
  --border: #1e2a38;
  --accent: #24C2C2;
  --gold: #e8b86d;
  --epic: #b07cff;
  --rare: #4da6ff;
  --common: #6fbf73;
  --text: #e8edf5;
  --dim: #8a96a8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(36,194,194,0.08), transparent 60%), #07090d;
  color: var(--text);
  padding: 18px 14px 40px;
  min-height: 100vh;
}
.header { text-align: center; margin-bottom: 22px; }
.logo { font-size: 1.55rem; font-weight: 900; letter-spacing: 3px; color: var(--accent); text-shadow: 0 0 18px rgba(36,194,194,0.45); }
.tabs { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid #1a2530; }
.tablinks {
  background: transparent; border: none; color: var(--dim);
  padding: 11px 16px; cursor: pointer; font-size: 0.76rem;
  letter-spacing: 1.4px; text-transform: uppercase; font-weight: 600;
  border-bottom: 2px solid transparent;
}
.tablinks.active { color: var(--accent); border-bottom-color: var(--accent); }
.tabcontent { display: none; }
.slot-card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; margin: 10px 0;
  box-shadow: 0 4px 14px rgba(0,0,0,0.35);
}
.slot-card h3 { font-size: 0.68rem; color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; align-items: flex-end; }
.field { flex: 1; min-width: 130px; }
label { font-size: 0.6rem; color: var(--dim); display: block; margin-bottom: 3px; letter-spacing: 0.6px; text-transform: uppercase; }
select {
  background: #080c12; color: var(--text); border: 1px solid #243040;
  padding: 8px 10px; border-radius: 6px; font-size: 0.84rem; width: 100%;
}
select:focus { outline: none; border-color: var(--accent); }
.desc { font-size: 0.7rem; color: #9ab4c8; margin-top: 4px; line-height: 1.35; }
.rarity-legendary { color: var(--gold); font-weight: 600; }
.rarity-epic { color: var(--epic); font-weight: 600; }
.rarity-rare { color: var(--rare); font-weight: 600; }
.rarity-fine { color: #7ec8e3; }
.rarity-common { color: var(--common); }
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 8px; margin-top: 12px; }
.stat-tile {
  background: linear-gradient(180deg, #121a24 0%, #0c1218 100%);
  border: 1px solid #1c2a3a; border-radius: 8px; padding: 12px 8px; text-align: center;
}
.stat-tile strong { display: block; font-size: 1.2rem; color: var(--accent); }
.stat-tile small { color: var(--dim); font-size: 0.62rem; letter-spacing: 0.4px; }
.dps-main { font-size: 1.7rem; color: var(--gold); font-weight: 700; }
.set-bonus { background: #0a1018; border-left: 3px solid var(--accent); padding: 7px 10px; margin: 5px 0; font-size: 0.78rem; border-radius: 0 5px 5px 0; }
.dev-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin: 8px 0; }
button.equip {
  background: var(--accent); color: #07090d; border: none; padding: 7px 12px;
  border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.78rem; margin-top: 6px;
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">ONCE HUMAN</div>
</div>
<div class="tabs">
  <button class="tablinks active" onclick="switchTab('Build')">Build</button>
  <button class="tablinks" onclick="switchTab('Deviations')">Deviations</button>
  <button class="tablinks" onclick="switchTab('Armor')">Armor</button>
  <button class="tablinks" onclick="switchTab('Results')">Results</button>
</div>

<div id="Build" class="tabcontent" style="display:block;">
  <div class="slot-card">
    <h3>Weapons</h3>
    <div class="row">
      <div class="field"><label>Primary</label><select id="weapon" onchange="updateBuild()"></select></div>
      <div class="field" style="max-width:85px;"><label>Tier</label><select id="wTier" onchange="updateBuild()"><option>I</option><option>II</option><option>III</option><option selected>IV</option><option>V</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Secondary</label><select id="weapon2" onchange="updateBuild()"></select></div>
      <div class="field" style="max-width:85px;"><label>Tier</label><select id="w2Tier" onchange="updateBuild()"><option>I</option><option>II</option><option>III</option><option selected>IV</option><option>V</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Melee</label><select id="melee" onchange="updateBuild()"></select></div>
      <div class="field" style="max-width:85px;"><label>Tier</label><select id="mTier" onchange="updateBuild()"><option>I</option><option>II</option><option>III</option><option selected>IV</option><option>V</option></select></div>
    </div>
  </div>
  <div id="armorSlots"></div>
</div>

<div id="Deviations" class="tabcontent">
  <div id="devList"></div>
</div>

<div id="Armor" class="tabcontent">
  <div id="setList"></div>
</div>

<div id="Results" class="tabcontent">
  <div style="margin-bottom:12px;">
    <label style="font-size:0.8rem;"><input type="checkbox" id="devToggle" onchange="updateBuild()" checked> Deviation Summoned</label>
  </div>
  <div id="dpsDisplay"></div>
  <div id="setBonuses"></div>
  <div class="results" id="statTiles"></div>
</div>

<script>
const roman = ["", "I", "II", "III", "IV", "V"];
const slots = ["helmet","mask","top","gloves","pants","shoes"];
const slotLabels = {helmet:"Helmet", mask:"Mask", top:"Top", gloves:"Gloves", pants:"Pants", shoes:"Shoes"};

const sets = {
  Lonewolf: {
    rarity: "Legendary",
    pieces: ["Lonewolf Hood","Lonewolf Mask","Lonewolf Jacket","Lonewolf Gloves","Lonewolf Pants","Lonewolf Shoes"],
    bonuses: [
      "1pc: Magazine Capacity +10%",
      "2pc: Crit Rate +5%",
      "3pc: Every 2 weapon crit hits → 1 stack Lone Shadow (+6% Crit DMG, max 8, 30s)",
      "4pc: Max Lone Shadow stacks to 10. Crit Rate +8% for 2s after reload"
    ]
  },
  Shelterer: {
    rarity: "Legendary",
    pieces: ["Shelterer Hood","Shelterer Mask","Shelterer Jacket","Shelterer Gloves","Shelterer Pants","Shelterer Shoes"],
    bonuses: [
      "1pc: Status DMG Reduction +15%",
      "2pc: Elemental DMG +8%",
      "3pc: Each hit → +1% Elemental DMG (max 20). Reload halves stacks.",
      "4pc: Max stacks +10 (to 30). +2 stacks on weakspot hits."
    ]
  },
  Renegade: {
    rarity: "Legendary",
    pieces: ["Renegade Hood","Renegade Mask","Renegade Jacket","Renegade Gloves","Renegade Pants","Renegade Shoes"],
    bonuses: [
      "1pc: Reload Speed +15%",
      "2pc: Weakspot DMG +10%",
      "3pc: Consecutive hits → Archer's Focus (+4% Weakspot DMG/stack, max 10)",
      "4pc: On reload, extra ammo based on previous mag weakspot rate"
    ]
  },
  Falcon: {
    rarity: "Epic",
    pieces: ["Falcon Hood","Falcon Mask","Falcon Jacket","Falcon Gloves","Falcon Pants","Falcon Shoes"],
    bonuses: [
      "1pc: Rolling Stamina Cost -20%",
      "2pc: Crit DMG +12%",
      "3pc: Stamina >90%: Crit Rate +5%, Crit DMG +20%",
      "4pc: Max Stamina +25. Recover 30 Stamina on kill."
    ]
  }
};

const weapons = ["SOCR - The Last Valor","KVD - Boom! Boom!","DE.50 - Jaws","ACS12 - Corrosion","MPS7 - Outer Space","AWS.338 - Bullseye"];
const meleeWeapons = [
  {name:"Stun Baton", rarity:"Epic"},
  {name:"Long Axe", rarity:"Epic"},
  {name:"The Fabled Masamune", rarity:"Legendary"},
  {name:"Frozen Northern Pike", rarity:"Epic"},
  {name:"Crowbar", rarity:"Epic"},
  {name:"Warning Sign", rarity:"Epic"},
  {name:"Baseball Bat", rarity:"Fine"},
  {name:"Wrench", rarity:"Fine"},
  {name:"Camping Knife", rarity:"Fine"},
  {name:"Northern Pike", rarity:"Fine"},
  {name:"Military Shovel", rarity:"Fine"},
  {name:"Military Dagger", rarity:"Fine"},
  {name:"Torch", rarity:"Common"},
  {name:"Broken Bottle", rarity:"Common"},
  {name:"Steel Pipe", rarity:"Common"}
];

const mods = [
  {name:"Crit Amplifier", rarity:"Epic", desc:"Crit Rate +8% / Crit DMG +15%", tier:"IV+"},
  {name:"Targeted Strike", rarity:"Epic", desc:"Weakspot DMG +12%", tier:"IV+"},
  {name:"Healing Fortification", rarity:"Rare", desc:"Status DMG Reduction +10%", tier:"III+"},
  {name:"Momentum Up", rarity:"Epic", desc:"Reload Speed +12%", tier:"IV+"},
  {name:"Bullet Siphon", rarity:"Legendary", desc:"Magazine Capacity +8%. Every 5 bullets consumed → +4% Weapon DMG (cap 20%)", tier:"V"},
  {name:"Precise Strike", rarity:"Epic", desc:"Weakspot hits grant +12% Weakspot DMG for 3s (max 3 stacks)", tier:"IV+"},
  {name:"First-Move Advantage", rarity:"Legendary", desc:"After reload: Crit Rate +10%, Crit DMG +20% for 2s", tier:"V"}
];

const hides = [
  {name:"None", desc:"No hide"},
  {name:"Wolf Hide", desc:"Cold/Frost Resist +10, Sprint Speed +5%"},
  {name:"Deer Hide", desc:"Cold Resist +5"},
  {name:"Highland Deer Hide", desc:"Cold/Frost Resist +10, Sprint Speed +5%"},
  {name:"Crocodile Skin", desc:"Heat/Burn Resist +15 (extra while Soaked)"}
];

const deviations = [
  {name:"Lonewolf's Whisper", rarity:"Rare", desc:"Pulls aggro, deals damage, increases Weapon DMG received by its target. Strong synergy with Shrapnel builds."},
  {name:"Dr. Teddy", rarity:"Rare", desc:"Healer deviation. Provides healing support in combat."},
  {name:"By-the-Wind", rarity:"Rare", desc:"Creates wind walls that block bullets."}
];

function switchTab(name) {
  document.querySelectorAll(".tabcontent").forEach(t => t.style.display = "none");
  document.querySelectorAll(".tablinks").forEach(b => b.classList.remove("active"));
  document.getElementById(name).style.display = "block";
  if (event && event.target) event.target.classList.add("active");
}

function buildArmorUI() {
  const container = document.getElementById("armorSlots");
  container.innerHTML = "";
  slots.forEach(slot => {
    const card = document.createElement("div");
    card.className = "slot-card";
    card.innerHTML = `
      <h3>${slotLabels[slot]}</h3>
      <div class="row">
        <div class="field"><label>Piece</label><select id="${slot}" onchange="updateBuild()"><option value="">None</option></select></div>
        <div class="field" style="max-width:75px;"><label>Tier</label><select id="${slot}Tier" onchange="updateBuild()">${roman.slice(1).map(r=>`<option>${r}</option>`).join("")}</select></div>
        <div class="field" style="max-width:75px;"><label>Stars</label><select id="${slot}Stars" onchange="updateBuild()"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
      </div>
      <div class="row">
        <div class="field"><label>Mod</label><select id="${slot}Mod" onchange="updateBuild()"><option value="">None</option></select><div class="desc" id="${slot}ModDesc"></div></div>
        <div class="field"><label>Hide</label><select id="${slot}Hide" onchange="updateBuild()"><option value="">None</option></select><div class="desc" id="${slot}HideDesc"></div></div>
      </div>
    `;
    container.appendChild(card);
  });
}

function populate() {
  const wsel = document.getElementById("weapon");
  const w2sel = document.getElementById("weapon2");
  weapons.forEach(w => {
    const o = document.createElement("option"); o.value = w; o.textContent = w;
    wsel.appendChild(o); w2sel.appendChild(o.cloneNode(true));
  });
  const msel = document.getElementById("melee");
  meleeWeapons.forEach(w => {
    const o = document.createElement("option");
    o.value = w.name;
    o.textContent = w.name;
    o.className = "rarity-" + w.rarity.toLowerCase();
    msel.appendChild(o);
  });

  slots.forEach(slot => {
    const sel = document.getElementById(slot);
    Object.keys(sets).forEach(setName => {
      const piece = sets[setName].pieces.find(p => p.toLowerCase().includes(slotLabels[slot].toLowerCase().slice(0,3)) || p.toLowerCase().includes(slot));
      if (piece) {
        const o = document.createElement("option");
        o.value = piece; o.textContent = piece; o.dataset.set = setName;
        sel.appendChild(o);
      }
    });
    const msel = document.getElementById(slot+"Mod");
    mods.forEach(m => {
      const o = document.createElement("option");
      o.value = m.name; o.textContent = m.name + " (" + m.tier + ")";
      o.className = "rarity-" + m.rarity.toLowerCase();
      msel.appendChild(o);
    });
    const hsel = document.getElementById(slot+"Hide");
    hides.forEach(h => {
      const o = document.createElement("option"); o.value = h.name; o.textContent = h.name; hsel.appendChild(o);
    });
  });

  const dlist = document.getElementById("devList");
  deviations.forEach(d => {
    const div = document.createElement("div");
    div.className = "dev-card";
    div.innerHTML = `<strong class="rarity-${d.rarity.toLowerCase()}">${d.name}</strong><div class="desc">${d.desc}</div>`;
    dlist.appendChild(div);
  });

  const slist = document.getElementById("setList");
  Object.keys(sets).forEach(name => {
    const s = sets[name];
    const div = document.createElement("div");
    div.className = "slot-card";
    div.innerHTML = `<h3 class="rarity-${s.rarity.toLowerCase()}">${name}</h3>` + s.bonuses.map(b=>`<div class="set-bonus">${b}</div>`).join("") +
      `<button class="equip" onclick="equipSetPieces('${name}')">Equip Pieces</button>`;
    slist.appendChild(div);
  });
}

function equipSetPieces(setName) {
  const s = sets[setName];
  slots.forEach((slot, i) => {
    const sel = document.getElementById(slot);
    const piece = s.pieces[i] || s.pieces.find(p => p.toLowerCase().includes(slotLabels[slot].toLowerCase().slice(0,4)));
    if (piece) {
      for (let j=0; j<sel.options.length; j++) {
        if (sel.options[j].value === piece) { sel.selectedIndex = j; break; }
      }
    }
  });
  updateBuild();
  switchTab("Build");
}

function getSetCounts() {
  const counts = {};
  slots.forEach(slot => {
    const sel = document.getElementById(slot);
    if (sel && sel.value) {
      const opt = sel.options[sel.selectedIndex];
      const set = opt?.dataset?.set;
      if (set) counts[set] = (counts[set]||0) + 1;
    }
  });
  return counts;
}

function updateBuild() {
  slots.forEach(slot => {
    const m = document.getElementById(slot+"Mod");
    const md = document.getElementById(slot+"ModDesc");
    const mod = mods.find(x => x.name === m.value);
    md.textContent = mod ? mod.desc : "";
    const h = document.getElementById(slot+"Hide");
    const hd = document.getElementById(slot+"HideDesc");
    const hide = hides.find(x => x.name === h.value);
    hd.textContent = hide ? hide.desc : "";
  });

  const counts = getSetCounts();
  const devOn = document.getElementById("devToggle")?.checked ?? true;

  let base = 12000;
  let critRate = 25;
  let critDmg = 150;
  let weak = 20;
  let weapon = 15;

  Object.entries(counts).forEach(([set, n]) => {
    if (set === "Lonewolf") {
      if (n>=1) weapon += 10;
      if (n>=2) critRate += 5;
      if (n>=3) critDmg += 48;
      if (n>=4) { critDmg += 12; critRate += 8; }
    }
    if (set === "Shelterer") {
      if (n>=2) weapon += 8;
      if (n>=3) weapon += 20;
      if (n>=4) weapon += 10;
    }
    if (set === "Renegade") {
      if (n>=2) weak += 10;
      if (n>=3) weak += 40;
    }
    if (set === "Falcon") {
      if (n>=2) critDmg += 12;
      if (n>=3) { critRate += 5; critDmg += 20; }
    }
  });

  slots.forEach(slot => {
    const m = document.getElementById(slot+"Mod")?.value;
    if (m === "Crit Amplifier") { critRate += 8; critDmg += 15; }
    if (m === "Targeted Strike") weak += 12;
    if (m === "Bullet Siphon") weapon += 8;
    if (m === "Precise Strike") weak += 12;
    if (m === "First-Move Advantage") { critRate += 10; critDmg += 20; }
  });

  if (devOn) { weapon += 15; critDmg += 10; }

  const critMult = 1 + (critRate/100) * (critDmg/100);
  const weakMult = 1 + weak/100;
  const weapMult = 1 + weapon/100;
  const dps = Math.round(base * critMult * weakMult * weapMult);
  const dpsNoDev = Math.round(base * (1+((critRate-(devOn?10:0))/100)*((critDmg-(devOn?10:0))/100)) * weakMult * (1+((weapon-(devOn?15:0))/100)));

  document.getElementById("dpsDisplay").innerHTML = `
    <div class="stat-tile" style="grid-column:1/-1;">
      <small>Estimated DPS</small>
      <div class="dps-main">${dps.toLocaleString()}</div>
      <small>Without deviation: ${dpsNoDev.toLocaleString()}</small>
    </div>`;

  const bonusDiv = document.getElementById("setBonuses");
  bonusDiv.innerHTML = "";
  Object.entries(counts).forEach(([set, n]) => {
    if (n>0 && sets[set]) {
      const active = sets[set].bonuses.filter((_,i) => i < n);
      bonusDiv.innerHTML += `<div class="set-bonus"><strong>${set} (${n}pc)</strong><br>${active.join("<br>")}</div>`;
    }
  });

  document.getElementById("statTiles").innerHTML = `
    <div class="stat-tile"><strong>${critRate}%</strong><small>Crit Rate</small></div>
    <div class="stat-tile"><strong>${critDmg}%</strong><small>Crit DMG</small></div>
    <div class="stat-tile"><strong>${weak}%</strong><small>Weakspot DMG</small></div>
    <div class="stat-tile"><strong>${weapon}%</strong><small>Weapon DMG</small></div>
    <div class="stat-tile"><strong>${devOn ? "Active" : "Off"}</strong><small>Deviation</small></div>
  `;
}

buildArmorUI();
populate();
updateBuild();
</script>
</body>
</html>
