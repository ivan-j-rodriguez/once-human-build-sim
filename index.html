<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Once Human</title>
<style>
:root {
  --bg: #07090d;
  --panel: #101820;
  --border: #1e2a38;
  --accent: #24C2C2;
  --gold: #e8b86d;
  --text: #e8edf5;
  --dim: #8a96a8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #07090d;
  color: var(--text);
  padding: 16px;
  min-height: 100vh;
}
.header { text-align: center; margin-bottom: 20px; }
.logo { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; color: var(--accent); }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid #1a2530; }
.tablinks {
  background: transparent; border: none; color: var(--dim);
  padding: 10px 16px; cursor: pointer; font-size: 0.85rem;
  letter-spacing: 1px; text-transform: uppercase;
  border-bottom: 2px solid transparent;
}
.tablinks.active { color: var(--accent); border-bottom-color: var(--accent); }
.tabcontent { display: none; }
.slot-card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; margin: 10px 0;
}
.slot-card h3 { font-size: 0.75rem; color: var(--accent); letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
label { font-size: 0.65rem; color: var(--dim); display: block; margin-bottom: 2px; }
select, input {
  background: #080c12; color: var(--text); border: 1px solid #243040;
  padding: 8px; border-radius: 4px; font-size: 0.85rem; flex: 1; min-width: 120px;
}
.desc { font-size: 0.75rem; color: #9ab; margin-top: 4px; font-style: italic; }
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
.stat-tile {
  background: #0e161f; border: 1px solid #1c2a3a; border-radius: 6px;
  padding: 12px; text-align: center;
}
.stat-tile strong { display: block; font-size: 1.2rem; color: var(--accent); }
.stat-tile small { color: var(--dim); font-size: 0.7rem; }
.dps-main { font-size: 1.6rem; color: var(--gold); font-weight: 700; }
.set-bonus { background: #0a1018; border-left: 3px solid var(--accent); padding: 8px 10px; margin: 6px 0; font-size: 0.82rem; }
.dev-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 8px 0; }
.rarity-legendary { color: #e8b86d; }
.rarity-epic { color: #b07cff; }
.rarity-rare { color: #4da6ff; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">ONCE HUMAN</div>
</div>
<div class="tabs">
  <button class="tablinks active" onclick="switchTab('Build')">Build</button>
  <button class="tablinks" onclick="switchTab('Deviations')">Deviations</button>
  <button class="tablinks" onclick="switchTab('Armor')">Armor</button>
  <button class="tablinks" onclick="switchTab('Results')">Results</button>
</div>

<div id="Build" class="tabcontent" style="display:block;">
  <div class="slot-card">
    <h3>Weapons</h3>
    <div class="row">
      <div style="flex:2"><label>Primary</label><select id="weapon" onchange="updateBuild()"></select></div>
      <div><label>Tier</label><select id="wTier" onchange="updateBuild()"><option>I</option><option>II</option><option>III</option><option selected>IV</option><option>V</option></select></div>
    </div>
    <div class="row">
      <div style="flex:2"><label>Secondary</label><select id="weapon2" onchange="updateBuild()"></select></div>
      <div><label>Tier</label><select id="w2Tier" onchange="updateBuild()"><option>I</option><option>II</option><option>III</option><option selected>IV</option><option>V</option></select></div>
    </div>
    <div class="row">
      <div style="flex:2"><label>Melee</label><select id="melee" onchange="updateBuild()"></select></div>
      <div><label>Tier</label><select id="mTier" onchange="updateBuild()"><option>I</option><option>II</option><option>III</option><option selected>IV</option><option>V</option></select></div>
    </div>
  </div>
  <div id="armorSlots"></div>
</div>

<div id="Deviations" class="tabcontent">
  <div id="devList"></div>
</div>

<div id="Armor" class="tabcontent">
  <div id="setList"></div>
</div>

<div id="Results" class="tabcontent">
  <div style="margin-bottom:12px;">
    <label><input type="checkbox" id="devToggle" onchange="updateBuild()" checked> Deviation Summoned</label>
  </div>
  <div id="dpsDisplay"></div>
  <div id="setBonuses"></div>
  <div class="results" id="statTiles"></div>
</div>

<script>
const roman = ["", "I", "II", "III", "IV", "V"];
const slots = ["helmet","mask","top","gloves","pants","shoes"];
const slotLabels = {helmet:"Helmet", mask:"Mask", top:"Top", gloves:"Gloves", pants:"Pants", shoes:"Shoes"};

const sets = {
  Lonewolf: {
    rarity: "Legendary",
    pieces: ["Lonewolf Hood","Lonewolf Mask","Lonewolf Jacket","Lonewolf Gloves","Lonewolf Pants","Lonewolf Shoes"],
    bonuses: [
      "1pc: Magazine Capacity +10%",
      "2pc: Crit Rate +5%",
      "3pc: Every 2 weapon crit hits → 1 stack Lone Shadow (+6% Crit DMG, max 8, 30s)",
      "4pc: Max Lone Shadow stacks to 10. Crit Rate +8% for 2s after reload"
    ]
  },
  Shelterer: {
    rarity: "Legendary",
    pieces: ["Shelterer Hood","Shelterer Mask","Shelterer Jacket","Shelterer Gloves","Shelterer Pants","Shelterer Shoes"],
    bonuses: [
      "1pc: Status DMG Reduction +15%",
      "2pc: Elemental DMG +8%",
      "3pc: Each hit → +1% Elemental DMG (max 20). Reload halves stacks.",
      "4pc: Max stacks +10 (to 30). +2 stacks on weakspot hits."
    ]
  },
  Renegade: {
    rarity: "Legendary",
    pieces: ["Renegade Hood","Renegade Mask","Renegade Jacket","Renegade Gloves","Renegade Pants","Renegade Shoes"],
    bonuses: [
      "1pc: Reload Speed +15%",
      "2pc: Weakspot DMG +10%",
      "3pc: Consecutive hits → Archer's Focus (+4% Weakspot DMG/stack, max 10)",
      "4pc: On reload, extra ammo based on previous mag weakspot rate"
    ]
  },
  Falcon: {
    rarity: "Epic",
    pieces: ["Falcon Hood","Falcon Mask","Falcon Jacket","Falcon Gloves","Falcon Pants","Falcon Shoes"],
    bonuses: [
      "1pc: Rolling Stamina Cost -20%",
      "2pc: Crit DMG +12%",
      "3pc: Stamina >90%: Crit Rate +5%, Crit DMG +20%",
      "4pc: Max Stamina +25. Recover 30 Stamina on kill."
    ]
  }
};

const weapons = ["SOCR - The Last Valor","KVD - Boom! Boom!","DE.50 - Jaws","ACS12 - Corrosion","MPS7 - Outer Space","AWS.338 - Bullseye"];
const meleeWeapons = ["Long Axe","Northern Pike","Wrench","Baseball Bat","Compound Bow","Recurve Crossbow"];
const mods = [
  {name:"Crit Amplifier", desc:"Crit Rate +8% / Crit DMG +15%"},
  {name:"Targeted Strike", desc:"Weakspot DMG +12%"},
  {name:"Healing Fortification", desc:"Status DMG Reduction +10%"},
  {name:"Momentum Up", desc:"Reload Speed +12%"},
  {name:"Bullet Siphon", desc:"Magazine Capacity +8%"}
];
const hides = [
  {name:"None", desc:"No hide"},
  {name:"Wolf Hide", desc:"Cold/Frost Resist +10, Sprint Speed +5%"},
  {name:"Deer Hide", desc:"Cold Resist +5"},
  {name:"Crocodile Skin", desc:"Heat/Burn Resist +15"}
];
const deviations = [
  {name:"Lonewolf's Whisper", rarity:"Rare", desc:"Pulls aggro, deals damage, increases Weapon DMG received by its target. Strong synergy with Shrapnel builds."},
  {name:"Dr. Teddy", rarity:"Rare", desc:"Healer deviation. Provides healing support in combat."},
  {name:"By-the-Wind", rarity:"Rare", desc:"Creates wind walls that block bullets."}
];

function switchTab(name) {
  document.querySelectorAll(".tabcontent").forEach(t => t.style.display = "none");
  document.querySelectorAll(".tablinks").forEach(b => b.classList.remove("active"));
  document.getElementById(name).style.display = "block";
  event?.target?.classList.add("active");
}

function buildArmorUI() {
  const container = document.getElementById("armorSlots");
  container.innerHTML = "";
  slots.forEach(slot => {
    const card = document.createElement("div");
    card.className = "slot-card";
    card.innerHTML = `
      <h3>${slotLabels[slot]}</h3>
      <div class="row">
        <div style="flex:2"><label>Piece</label><select id="${slot}" onchange="updateBuild()"><option value="">None</option></select></div>
        <div><label>Tier</label><select id="${slot}Tier" onchange="updateBuild()">${roman.slice(1).map(r=>`<option>${r}</option>`).join("")}</select></div>
        <div><label>Stars</label><select id="${slot}Stars" onchange="updateBuild()"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
      </div>
      <div class="row">
        <div style="flex:1"><label>Mod</label><select id="${slot}Mod" onchange="updateBuild()"><option value="">None</option></select><div class="desc" id="${slot}ModDesc"></div></div>
        <div style="flex:1"><label>Hide</label><select id="${slot}Hide" onchange="updateBuild()"><option value="">None</option></select><div class="desc" id="${slot}HideDesc"></div></div>
      </div>
    `;
    container.appendChild(card);
  });
}

function populate() {
  // weapons
  const wsel = document.getElementById("weapon");
  const w2sel = document.getElementById("weapon2");
  const msel = document.getElementById("melee");
  weapons.forEach(w => { const o = document.createElement("option"); o.value = w; o.textContent = w; wsel.appendChild(o); w2sel.appendChild(o.cloneNode(true)); });
  meleeWeapons.forEach(w => { const o = document.createElement("option"); o.value = w; o.textContent = w; msel.appendChild(o); });
  // armor pieces
  slots.forEach(slot => {
    const sel = document.getElementById(slot);
    Object.keys(sets).forEach(setName => {
      const piece = sets[setName].pieces.find(p => p.toLowerCase().includes(slotLabels[slot].toLowerCase().slice(0,3)) || p.toLowerCase().includes(slot));
      if (piece) {
        const o = document.createElement("option");
        o.value = piece; o.textContent = piece; o.dataset.set = setName;
        sel.appendChild(o);
      }
    });
    // mods
    const msel = document.getElementById(slot+"Mod");
    mods.forEach(m => { const o = document.createElement("option"); o.value = m.name; o.textContent = m.name; msel.appendChild(o); });
    // hides
    const hsel = document.getElementById(slot+"Hide");
    hides.forEach(h => { const o = document.createElement("option"); o.value = h.name; o.textContent = h.name; hsel.appendChild(o); });
  });
  // deviations
  const dlist = document.getElementById("devList");
  deviations.forEach(d => {
    const div = document.createElement("div");
    div.className = "dev-card";
    div.innerHTML = `<strong class="rarity-${d.rarity.toLowerCase()}">${d.name}</strong><div class="desc">${d.desc}</div>`;
    dlist.appendChild(div);
  });
  // sets
  const slist = document.getElementById("setList");
  Object.keys(sets).forEach(name => {
    const s = sets[name];
    const div = document.createElement("div");
    div.className = "slot-card";
    div.innerHTML = `<h3 class="rarity-${s.rarity.toLowerCase()}">${name}</h3>` + s.bonuses.map(b=>`<div class="set-bonus">${b}</div>`).join("") +
      `<button onclick="equipSetPieces('${name}')" style="margin-top:8px;background:#24C2C2;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">Equip Pieces</button>`;
    slist.appendChild(div);
  });
}

function equipSetPieces(setName) {
  const s = sets[setName];
  slots.forEach((slot, i) => {
    const sel = document.getElementById(slot);
    const piece = s.pieces[i] || s.pieces.find(p => p.toLowerCase().includes(slotLabels[slot].toLowerCase().slice(0,4)));
    if (piece) {
      for (let j=0; j<sel.options.length; j++) {
        if (sel.options[j].value === piece) { sel.selectedIndex = j; break; }
      }
    }
  });
  updateBuild();
  switchTab("Build");
}

function getSetCounts() {
  const counts = {};
  slots.forEach(slot => {
    const sel = document.getElementById(slot);
    if (sel && sel.value) {
      const opt = sel.options[sel.selectedIndex];
      const set = opt?.dataset?.set;
      if (set) counts[set] = (counts[set]||0) + 1;
    }
  });
  return counts;
}

function updateBuild() {
  // update mod/hide descs
  slots.forEach(slot => {
    const m = document.getElementById(slot+"Mod");
    const md = document.getElementById(slot+"ModDesc");
    const mod = mods.find(x => x.name === m.value);
    md.textContent = mod ? mod.desc : "";
    const h = document.getElementById(slot+"Hide");
    const hd = document.getElementById(slot+"HideDesc");
    const hide = hides.find(x => x.name === h.value);
    hd.textContent = hide ? hide.desc : "";
  });

  const counts = getSetCounts();
  const devOn = document.getElementById("devToggle")?.checked ?? true;

  // simple DPS model
  let base = 12000;
  let critRate = 25;
  let critDmg = 150;
  let weak = 20;
  let weapon = 15;

  Object.entries(counts).forEach(([set, n]) => {
    if (set === "Lonewolf") {
      if (n>=1) weapon += 10;
      if (n>=2) critRate += 5;
      if (n>=3) critDmg += 48; // 8 stacks
      if (n>=4) { critDmg += 12; critRate += 8; } // full 10 stacks + reload
    }
    if (set === "Shelterer") {
      if (n>=2) weapon += 8;
      if (n>=3) weapon += 20;
      if (n>=4) weapon += 10;
    }
    if (set === "Renegade") {
      if (n>=2) weak += 10;
      if (n>=3) weak += 40;
    }
    if (set === "Falcon") {
      if (n>=2) critDmg += 12;
      if (n>=3) { critRate += 5; critDmg += 20; }
    }
  });

  // mods
  slots.forEach(slot => {
    const m = document.getElementById(slot+"Mod")?.value;
    if (m === "Crit Amplifier") { critRate += 8; critDmg += 15; }
    if (m === "Targeted Strike") weak += 12;
    if (m === "Bullet Siphon") weapon += 8;
  });

  if (devOn) { weapon += 15; critDmg += 10; } // example deviation bonus

  const critMult = 1 + (critRate/100) * (critDmg/100);
  const weakMult = 1 + weak/100;
  const weapMult = 1 + weapon/100;
  const dps = Math.round(base * critMult * weakMult * weapMult);
  const dpsNoDev = Math.round(base * (1+(critRate-10)/100*(critDmg-10)/100) * weakMult * (1+(weapon-15)/100));

  document.getElementById("dpsDisplay").innerHTML = `
    <div class="stat-tile" style="grid-column:1/-1;">
      <small>Estimated DPS</small>
      <div class="dps-main">${dps.toLocaleString()}</div>
      <small>Without deviation: ${dpsNoDev.toLocaleString()}</small>
    </div>`;

  const bonusDiv = document.getElementById("setBonuses");
  bonusDiv.innerHTML = "";
  Object.entries(counts).forEach(([set, n]) => {
    if (n>0 && sets[set]) {
      const active = sets[set].bonuses.filter((_,i) => i < n);
      bonusDiv.innerHTML += `<div class="set-bonus"><strong>${set} (${n}pc)</strong><br>${active.join("<br>")}</div>`;
    }
  });

  document.getElementById("statTiles").innerHTML = `
    <div class="stat-tile"><strong>${critRate}%</strong><small>Crit Rate</small></div>
    <div class="stat-tile"><strong>${critDmg}%</strong><small>Crit DMG</small></div>
    <div class="stat-tile"><strong>${weak}%</strong><small>Weakspot DMG</small></div>
    <div class="stat-tile"><strong>${weapon}%</strong><small>Weapon DMG</small></div>
    <div class="stat-tile"><strong>${devOn ? "Active" : "Off"}</strong><small>Deviation</small></div>
  `;
}

buildArmorUI();
populate();
updateBuild();
</script>
</body>
</html>
