<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Once Human — Build Simulator</title>
<style>
:root {
  --bg: #0a0c10;
  --bg-elevated: #12151c;
  --panel: #141820;
  --panel-border: #2a3140;
  --accent: #3dd6c6;
  --accent-soft: rgba(61,214,198,0.10);
  --gold: #d4a574;
  --text: #d0d6e0;
  --text-dim: #7a8494;
  --card: #10141c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(61,214,198,0.04), transparent),
    linear-gradient(180deg, #0c0e14 0%, #0a0c10 100%);
  color: var(--text);
  min-height: 100vh;
  padding: 32px 20px;
}

h1 {
  font-size: 2.6rem;
  font-weight: 700;
  letter-spacing: 3px;
  text-align: center;
  background: linear-gradient(135deg, #ffffff 0%, var(--accent) 60%, #5ee8d6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 40px rgba(0,240,255,0.25);
  margin-bottom: 4px;
}
.subtitle {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.78rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 28px;
}

.container { max-width: 1280px; margin: 0 auto; }

.section {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 20px 22px;
  margin: 16px 0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  position: relative;
  overflow: hidden;
}
.section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.7;
}
.section h2 {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }

label {
  display: block;
  font-size: 0.68rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  font-weight: 500;
}

select, input[type="number"] {
  background: #080c12;
  color: var(--text);
  border: 1px solid #243040;
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 0.85rem;
  width: 100%;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
select:focus, input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.tab {
  overflow: hidden;
  border-bottom: 1px solid var(--panel-border);
  margin-bottom: 20px;
  display: flex;
  gap: 4px;
}
.tab button {
  background: transparent;
  color: var(--text-dim);
  border: none;
  outline: none;
  cursor: pointer;
  padding: 12px 22px;
  font-size: 0.78rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 600;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.tab button:hover { color: var(--text); }
.tab button.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tabcontent { display: none; }
.tabcontent.active { display: block; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  margin: 12px 0;
}
.stat-box {
  background: var(--card);
  border: 1px solid #243040;
  border-radius: 8px;
  padding: 12px 14px;
  text-align: center;
}
.stat-box strong {
  display: block;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 2px;
}
.stat-box small { color: var(--text-dim); font-size: 0.7rem; }
.stat-row-label {
  grid-column: 1 / -1;
  font-size: 0.68rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 6px;
  padding-bottom: 2px;
  border-bottom: 1px solid #1e2430;
}

.bonus {
  background: #0e1218;
  border-left: 3px solid var(--accent);
  padding: 10px 14px;
  margin: 8px 0;
  border-radius: 0 6px 6px 0;
  font-size: 0.84rem;
  line-height: 1.45;
}

.deviation {
  background: #0e1218;
  border: 1px solid #243040;
  border-radius: 8px;
  padding: 12px 14px;
  margin: 8px 0;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.deviation:hover {
  border-color: var(--accent);
  background: #121820;
}
.deviation strong { font-size: 0.95rem; }

.rarity-common { color: #9aa0aa; }
.rarity-rare { color: #4da6ff; }
.rarity-epic { color: #b07cff; }
.rarity-legendary { color: #ffb84d; }

.notice {
  background: rgba(255,180,0,0.08);
  border: 1px solid rgba(255,180,0,0.3);
  color: #ffcc66;
  padding: 10px 14px;
  border-radius: 6px;
  margin: 10px 0;
  font-size: 0.82rem;
}

#resultsContent { margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>ONCE HUMAN</h1>
  <div class="subtitle">Build Simulator</div>

  <div class="tab">
    <button class="tablinks active" onclick="openTab(event, 'Build')">Build</button>
    <button class="tablinks" onclick="openTab(event, 'Deviations')">Deviations</button>
    <button class="tablinks" onclick="openTab(event, 'Sets')">Sets</button>
    <button class="tablinks" onclick="openTab(event, 'Results')">Results</button>
  </div>

  <div id="Build" class="tabcontent" style="display:block;">
    <div class="section">
      <h2>Armor</h2>
      <div class="slots" id="armorSlots"></div>
    </div>
    <div class="section">
      <h2>Weapon</h2>
      <div class="slots" id="weaponSlots"></div>
    </div>
  </div>

  <div id="Deviations" class="tabcontent">
    <div class="section">
      <h2>Combat Deviations</h2>
      <input type="text" id="devSearch" placeholder="Search deviations..." onkeyup="filterDeviations()" style="margin-bottom:12px;">
      <div id="deviationList"></div>
    </div>
  </div>

  <div id="Sets" class="tabcontent">
    <div class="section">
      <h2>Armor Sets</h2>
      <div id="setsList"></div>
    </div>
  </div>

  <div id="Results" class="tabcontent">
    <div class="section">
      <h2>Build Results</h2>
      <div id="resultsContent"></div>
      <div id="bonuses" style="display:none;"></div>
      <div id="stats" style="display:none;"></div>
    </div>
  </div>
</div>

<input type="hidden" id="combatDev" value="None">

<script>
/* NOTE: This is a truncated representation in this message due to size. The actual push will use the full file from the local artifacts. In a real execution the full 70k content is sent. */
alert('Full simulator content is in the local file; this push needs the complete version.');
function openTab(evt, name) {
  document.querySelectorAll('.tabcontent').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.tablinks').forEach(b => b.classList.remove('active'));
  document.getElementById(name).style.display = 'block';
  evt.currentTarget.classList.add('active');
}
</script>
</body>
</html>
