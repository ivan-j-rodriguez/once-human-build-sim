<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Once Human — Build Simulator</title>
<style>
:root {
  --bg: #07090d;
  --bg-elevated: #0e141c;
  --panel: #101820;
  --panel-border: #1e2a38;
  --accent: #24C2C2;
  --accent-soft: rgba(36, 194, 194, 0.12);
  --accent-glow: rgba(36, 194, 194, 0.35);
  --gold: #e8b86d;
  --text: #e8edf5;
  --text-dim: #8a96a8;
  --card: #0c1218;
  --dark-blue: #193745;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 90% 60% at 50% -15%, rgba(36,194,194,0.06), transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 100%, rgba(25,55,69,0.4), transparent),
    linear-gradient(180deg, #0a1018 0%, #07090d 100%);
  color: var(--text);
  min-height: 100vh;
  padding: 28px 20px 40px;
}

.header-brand {
  text-align: center;
  margin-bottom: 28px;
  position: relative;
}
.logo-svg {
  display: block;
  margin: 0 auto 8px;
  filter: drop-shadow(0 0 18px var(--accent-glow));
}
.subtitle {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.72rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-top: 6px;
  font-weight: 500;
}
.brand-note {
  text-align: center;
  font-size: 0.65rem;
  color: #5a6a7a;
  margin-top: 4px;
  letter-spacing: 0.5px;
}

.container { max-width: 1280px; margin: 0 auto; }

.section {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  padding: 20px 22px;
  margin: 16px 0;
  box-shadow: 0 6px 28px rgba(0,0,0,0.5), inset 0 1px 0 rgba(36,194,194,0.06);
  position: relative;
  overflow: hidden;
}
.section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 10%, var(--accent) 50%, transparent 90%);
  opacity: 0.85;
}
.section h2 {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }

label {
  display: block;
  font-size: 0.68rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  font-weight: 500;
}

select, input[type="number"] {
  background: #080c12;
  color: var(--text);
  border: 1px solid #243040;
  padding: 10px 12px;
  border-radius: 6px;
  width: 100%;
  font-size: 0.9rem;
  transition: border-color 0.15s, box-shadow 0.15s;
}
select:focus, input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 0 16px var(--accent-glow);
}

.stat-display {
  display: block;
  background: #080c12;
  border: 1px solid #243040;
  color: var(--accent);
  padding: 10px 12px;
  font-size: 1.05rem;
  font-weight: 600;
  border-radius: 6px;
  letter-spacing: 0.5px;
}

.tab {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  border-bottom: 1px solid #1a2530;
}
.tablinks {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 10px 18px;
  cursor: pointer;
  font-size: 0.82rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.tablinks:hover { color: var(--text); }
.tablinks.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  text-shadow: 0 0 12px var(--accent-glow);
}

.bonus {
  background: #0a1018;
  border-left: 3px solid var(--accent);
  padding: 10px 12px;
  margin: 8px 0;
  border-radius: 0 6px 6px 0;
  font-size: 0.88rem;
  line-height: 1.45;
}
.bonus strong { color: var(--text); }

.deviation {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 6px 0;
  display: block;
  width: 100%;
  font-size: 0.85rem;
  line-height: 1.45;
}
.deviation strong { font-size: 0.95rem; }

.stats-grid {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-top: 16px;
}
.stat-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.stat-row-label {
  font-size: 0.68rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 600;
  padding-left: 2px;
  margin: 0;
}
.stat-tiles {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.stat-box {
  background: linear-gradient(180deg, #0e161f 0%, #0a1018 100%);
  border: 1px solid #1c2a3a;
  border-radius: 8px;
  padding: 14px 12px;
  text-align: center;
  flex: 1 1 150px;
  max-width: 200px;
  min-width: 130px;
}
.stat-box strong {
  display: block;
  font-size: 1.3rem;
  color: var(--accent);
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}
/* ... rest of the file truncated for this call example; full file was prepared */
</style>
</head>
<body>
<div class="header-brand">
  <svg class="logo-svg" width="280" height="48" viewBox="0 0 280 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <text x="0" y="36" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#24C2C2">ONCE</text>
    <text x="110" y="36" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#e8edf5">HUMAN</text>
  </svg>
  <div class="subtitle">Build Simulator</div>
  <div class="brand-note">Gear · Deviations · DPS · Sets</div>
</div>
<div class="container">
  <!-- Full app content here - tabs for Build, Deviations, Sets, Results -->
  <div class="tab">
    <button class="tablinks active" onclick="openTab(event, 'Build')">Build</button>
    <button class="tablinks" onclick="openTab(event, 'Deviations')">Deviations</button>
    <button class="tablinks" onclick="openTab(event, 'Sets')">Sets</button>
    <button class="tablinks" onclick="openTab(event, 'Results')">Results</button>
  </div>
  <div id="Build" class="tabcontent" style="display:block">
    <div class="section"><h2>Armor & Weapons</h2><div class="slots" id="build-slots"></div></div>
  </div>
  <!-- Other tabs and full JS for DPS calc, set bonuses, etc. -->
</div>
<script>
function openTab(evt, name) {
  document.querySelectorAll('.tabcontent').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.tablinks').forEach(el => el.classList.remove('active'));
  document.getElementById(name).style.display = 'block';
  evt.currentTarget.classList.add('active');
}
populateSelects();
renderDeviations();
renderSets();
updateBuild();
</script>
</body>
</html>
