<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Once Human</title>
<style>
:root {
  --bg: #07090d;
  --bg-elevated: #0e141c;
  --panel: #101820;
  --panel-border: #1e2a38;
  --accent: #24C2C2;
  --accent-soft: rgba(36, 194, 194, 0.12);
  --accent-glow: rgba(36, 194, 194, 0.35);
  --gold: #e8b86d;
  --text: #e8edf5;
  --text-dim: #8a96a8;
  --card: #0c1218;
  --dark-blue: #193745;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 90% 60% at 50% -15%, rgba(36,194,194,0.06), transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 100%, rgba(25,55,69,0.4), transparent),
    linear-gradient(180deg, #0a1018 0%, #07090d 100%);
  color: var(--text);
  min-height: 100vh;
  padding: 28px 20px 40px;
}

.header-brand {
  text-align: center;
  margin-bottom: 28px;
  position: relative;
}
.logo-svg {
  display: block;
  margin: 0 auto 8px;
  filter: drop-shadow(0 0 18px var(--accent-glow));
}
.subtitle {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.72rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-top: 6px;
  font-weight: 500;
}
.brand-note {
  text-align: center;
  font-size: 0.65rem;
  color: #5a6a7a;
  margin-top: 4px;
  letter-spacing: 0.5px;
}

.container { max-width: 1280px; margin: 0 auto; }

.section {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  padding: 20px 22px;
  margin: 16px 0;
  box-shadow: 0 6px 28px rgba(0,0,0,0.5), inset 0 1px 0 rgba(36,194,194,0.06);
  position: relative;
  overflow: hidden;
}
.section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 10%, var(--accent) 50%, transparent 90%);
  opacity: 0.85;
}
.section h2 {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }

label {
  display: block;
  font-size: 0.68rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  font-weight: 500;
}

select, input[type="number"] {
  background: #080c12;
  color: var(--text);
  border: 1px solid #243040;
  padding: 10px 12px;
  border-radius: 6px;
  width: 100%;
  font-size: 0.9rem;
  transition: border-color 0.15s, box-shadow 0.15s;
}
select:focus, input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 0 16px var(--accent-glow);
}

.stat-display {
  display: block;
  background: #080c12;
  border: 1px solid #243040;
  color: var(--accent);
  padding: 10px 12px;
  font-size: 1.05rem;
  font-weight: 600;
  border-radius: 6px;
  letter-spacing: 0.5px;
}

.tab {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  border-bottom: 1px solid #1a2530;
}
.tabcontent { display: none; }
.tab { position: relative; z-index: 20; pointer-events: auto; }
.tablinks { pointer-events: auto; position: relative; z-index: 21; }
.tablinks {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 10px 18px;
  cursor: pointer;
  font-size: 0.82rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.tablinks:hover { color: var(--text); }
.tablinks.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  text-shadow: 0 0 12px var(--accent-glow);
}

.bonus {
  background: #0a1018;
  border-left: 3px solid var(--accent);
  padding: 10px 12px;
  margin: 8px 0;
  border-radius: 0 6px 6px 0;
  font-size: 0.88rem;
  line-height: 1.45;
}
.bonus strong { color: var(--text); }

.deviation {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 6px 0;
  display: block;
  width: 100%;
  font-size: 0.85rem;
  line-height: 1.45;
}
.deviation strong { font-size: 0.95rem; }

.stats-grid {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-top: 16px;
}
.stat-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.stat-row-label {
  font-size: 0.68rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 600;
  padding-left: 2px;
  margin: 0;
}
.stat-tiles {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.stat-box {
  background: linear-gradient(180deg, #0e161f 0%, #0a1018 100%);
  border: 1px solid #1c2a3a;
  border-radius: 8px;
  padding: 14px 12px;
  text-align: center;
  flex: 1 1 150px;
  max-width: 200px;
  min-width: 130px;
}
.stat-box strong {
  display: block;
  font-size: 1.3rem;
  color: var(--accent);
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}
.stat-box small { color: var(--text-dim); font-size: 0.68rem; }

.note {
  font-size: 0.78rem;
  color: var(--text-dim);
  margin: 10px 0;
  line-height: 1.5;
}

.rarity-legendary { color: #e8b86d; font-weight: 600; }
.rarity-epic { color: #b07cff; font-weight: 600; }
.rarity-rare { color: #4da6ff; font-weight: 600; }
.rarity-common { color: #6fbf73; font-weight: 500; }
.rarity-key { color: #ff9a4a; font-weight: 600; }

@media (max-width: 700px) {
  .slots { grid-template-columns: 1fr; }
  .logo-svg { width: 220px; height: auto; }
}

/* tabs */
.tabcontent { display: none; }



</style>

</head>

<script>
function switchTab(name) {
  var contents = document.querySelectorAll(".tabcontent");
  for (var i = 0; i < contents.length; i++) contents[i].style.display = "none";
  var buttons = document.querySelectorAll(".tablinks");
  for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove("active");
  var target = document.getElementById(name);
  if (target) target.style.display = "block";
  for (var i = 0; i < buttons.length; i++) {
    if (buttons[i].getAttribute("onclick") && buttons[i].getAttribute("onclick").indexOf(name) !== -1) {
      buttons[i].classList.add("active");
    }
  }
}
window.switchTab = switchTab;
document.addEventListener("click", function(e) {
  var btn = e.target;
  if (btn && btn.classList && btn.classList.contains("tablinks")) {
    var oc = btn.getAttribute("onclick") || "";
    var m = oc.match(/switchTab\('([^']+)'\)/);
    if (m) switchTab(m[1]);
  }
});

// Level → approximate multiplier on base stats (rough but directional)
function modLevelMultiplier(level) {
  if (level <= 2) return 1.0;      // Common
  if (level <= 4) return 1.4;      // Uncommon
  if (level <= 6) return 1.9;      // Rare
  if (level <= 8) return 2.5;      // Epic
  if (level <= 12) return 3.2;     // Legendary early
  if (level <= 16) return 4.0;     // Legendary mid
  return 4.8;                      // Lv17 / Shiny range
}

function rarityFromModLevel(level) {
  if (level <= 2) return "Common";
  if (level <= 4) return "Uncommon";
  if (level <= 6) return "Rare";
  if (level <= 8) return "Epic";
  return "Legendary";
}

function rarityClass(rarity) {
  if (!rarity) return "";
  const r = rarity.toLowerCase();
  if (r.includes("legend")) return "rarity-legendary";
  if (r.includes("epic")) return "rarity-epic";
  if (r.includes("rare")) return "rarity-rare";
  if (r.includes("common") || r.includes("standard") || r.includes("fine")) return "rarity-common";
  if (r.includes("key")) return "rarity-key";
  return "";
}

function populateSelects() {
  const rarityOrder = { "Legendary": 0, "Epic": 1, "Rare": 2, "Fine": 2, "Common": 3, "Standard": 3, "Key": 0, "": 4 };

  Object.keys(slotPieces).forEach(slot => {
    const sel = document.getElementById(slot);
    if (!sel) return;
    sel.innerHTML = "";
    const none = document.createElement("option");
    none.value = "None";
    none.textContent = "None";
    sel.appendChild(none);
    const sorted = [...slotPieces[slot]].sort((a, b) => {
      const setA = sets[a.set];
      const setB = sets[b.set];
      const ra = a.set === "Key" ? 0 : (rarityOrder[setA?.rarity] ?? 5);
      const rb = b.set === "Key" ? 0 : (rarityOrder[setB?.rarity] ?? 5);
      if (ra !== rb) return ra - rb;
      return a.name.localeCompare(b.name);
    });
    sorted.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.name;
      opt.textContent = p.name;
      opt.dataset.set = p.set || "";
      const setData = sets[p.set];
      if (setData) opt.dataset.rarity = setData.rarity;
      else if (p.set === "Key") opt.dataset.rarity = "Key";
      opt.className = rarityClass(setData?.rarity || (p.set === "Key" ? "Key" : ""));
      sel.appendChild(opt);
    });
  });

  const wSel = document.getElementById("weapon");
  wSel.innerHTML = "";
  const sortedWeapons = [...weapons].sort((a, b) => {
    const ra = rarityOrder[a.rarity] ?? 5;
    const rb = rarityOrder[b.rarity] ?? 5;
    if (ra !== rb) return ra - rb;
    return a.name.localeCompare(b.name);
  });
  sortedWeapons.forEach(w => {
    const opt = document.createElement("option");
    opt.value = w.name;
    opt.textContent = w.name;
    opt.className = rarityClass(w.rarity);
    wSel.appendChild(opt);
  });

  const w2Sel = document.getElementById("weapon2");
  if (w2Sel) {
    w2Sel.innerHTML = "";
    sortedWeapons.forEach(w => {
      const opt = document.createElement("option");
      opt.value = w.name;
      opt.textContent = w.name;
      opt.className = rarityClass(w.rarity);
      w2Sel.appendChild(opt);
    });
  }

  // Mods
  const armorModSel = document.getElementById("armorMod");
  const weaponModSel = document.getElementById("weaponMod");
  if (armorModSel) {
    armorModSel.innerHTML = "";
    modTypes.filter(m => m.slot === "armor" || m.slot === "any").forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.name;
      opt.textContent = m.name;
      armorModSel.appendChild(opt);
    });
  }
  if (weaponModSel) {
    weaponModSel.innerHTML = "";
    modTypes.filter(m => m.slot === "weapon" || m.slot === "any").forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.name;
      opt.textContent = m.name;
      weaponModSel.appendChild(opt);
    });
  }

  // Accessories
  ["accSight","accMuzzle","accGrip","accMag"].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const slotMap = { accSight: "Sight", accMuzzle: "Muzzle", accGrip: "Grip", accMag: "Magazine" };
    const target = slotMap[id];
    sel.innerHTML = "";
    accessories.filter(a => a.slot === target || a.slot === "any").forEach(a => {
      const opt = document.createElement("option");
      opt.value = a.name;
      opt.textContent = a.name + (a.rarity && a.rarity !== "Common" ? ` (${a.rarity})` : "");
      opt.className = rarityClass(a.rarity);
      sel.appendChild(opt);
    });
  });

  // Hides
  const hideSel = document.getElementById("hideSelect");
  if (hideSel) {
    hideSel.innerHTML = "";
    hides.forEach(h => {
      const opt = document.createElement("option");
      opt.value = h.name;
      opt.textContent = h.name + (h.family ? ` (${h.family})` : "");
      opt.className = rarityClass(h.rarity);
      hideSel.appendChild(opt);
    });
  }
}

function getEquippedSets() {
  const counts = {};
  ["helmet","mask","top","gloves","pants","shoes"].forEach(slot => {

    if (set && set !== "Key") {

function calculateDPS(devBonus = null) {
  const tier = parseInt(document.getElementById("weaponTier").value) || 3;
  const stars = parseInt(document.getElementById("weaponStars").value) || 3;
  const wSel = document.getElementById("weapon");
  const wName = wSel.value;
  const weapon = weapons.find(w => w.name === wName) || { baseT1: 100 };

  // Realistic scaling: Tier multiplies base heavily; stars add ~8-12% each
  const tierMult = [0, 1.0, 1.55, 2.4, 3.6, 5.2][tier] || 2.4;
  const starMult = 1 + (stars - 1) * 0.09;
  let base = (weapon.baseT1 || 100) * tierMult * starMult;

  // Allow manual override if user edits the input
  const manualBase = parseFloat(document.getElementById("baseDmg").value);
  if (manualBase && document.activeElement?.id === "baseDmg") {
    base = manualBase;
  } else {
    document.getElementById("baseDmg").value = Math.round(base);
  }

  let wDmg = (window.currentTotals?.weaponDmg || 0) / 100;
  let cDmg = (window.currentTotals?.critDmg || 0) / 100;
  let wsDmg = (window.currentTotals?.weakspot || 0) / 100;
  const cRate = (window.currentTotals?.critRate || 0) / 100;
  let elem = (window.currentTotals?.elemDmg || 0) / 100;
  const status = (window.currentTotals?.statusDmg || 0) / 100;

  let vuln = 0;
  if (devBonus) {
    if (devBonus.weakspot) wsDmg += devBonus.weakspot / 100;
    if (devBonus.elemDmg) elem += devBonus.elemDmg / 100;
    if (devBonus.vuln) vuln = devBonus.vuln / 100;
  }

  const afterWeapon = base * (1 + wDmg);
  const body = afterWeapon * (1 + vuln);
  const bodyCrit = afterWeapon * (1 + cDmg) * (1 + vuln);
  const weakspot = afterWeapon * (1 + wsDmg) * (1 + vuln);
  const weakspotCrit = afterWeapon * (1 + cDmg + wsDmg) * (1 + vuln);

  const elemMult = 1 + elem;
  const statusMult = 1 + status;

  const bodyFinal = body * elemMult * statusMult;
  const bodyCritFinal = bodyCrit * elemMult * statusMult;
  const wsFinal = weakspot * elemMult * statusMult;
  const wsCritFinal = weakspotCrit * elemMult * statusMult;

  const expectedBody = bodyFinal * (1 - cRate) + bodyCritFinal * cRate;
  const expectedWS = wsFinal * (1 - cRate) + wsCritFinal * cRate;

  return {
    body: Math.round(bodyFinal),
    bodyCrit: Math.round(bodyCritFinal),
    weakspot: Math.round(wsFinal),
    weakspotCrit: Math.round(wsCritFinal),
    expectedBody: Math.round(expectedBody),
    expectedWS: Math.round(expectedWS)
  };
}

function calculateSetTotals(counts) {
  const totals = {
    critRate: 0,
    critDmg: 0,
    weakspot: 0,
    weaponDmg: 0,
    elemDmg: 0,
    statusDmg: 0,
    magCap: 0,
    reload: 0,
    maxHP: 0,
    dmgRed: 0,
    notes: []
  };

  Object.keys(counts).forEach(setName => {
    const count = Math.min(counts[setName], 4);
    const data = setBonusNumbers[setName];
    if (!data || !data[count]) return;

    const b = data[count];
    if (b.critRate) totals.critRate += b.critRate;
    if (b.critRateTemp) totals.notes.push(`${setName}: +${b.critRateTemp}% Crit Rate (2s after reload)`);
    if (b.critRateCond) totals.notes.push(`${setName}: +${b.critRateCond}% Crit Rate (Stamina >90%)`);

    if (b.critDmg) totals.critDmg += b.critDmg;
    if (b.critDmgMax) totals.notes.push(`${setName}: up to +${b.critDmgMax}% Crit DMG (max stacks)`);
    if (b.critDmgCond) totals.notes.push(`${setName}: +${b.critDmgCond}% Crit DMG (Stamina >90%)`);

    if (b.weakspot) totals.weakspot += b.weakspot;
    if (b.weakspotMax) totals.notes.push(`${setName}: up to +${b.weakspotMax}% Weakspot DMG (max stacks)`);

    if (b.weaponDmgCond) totals.notes.push(`${setName}: +${b.weaponDmgCond}% Weapon DMG (HP >70%)`);
    if (b.weaponDmgState) totals.notes.push(`${setName}: +${b.weaponDmgState}% Weapon DMG (Bastille state)`);
    if (b.weaponStatusCond) totals.notes.push(`${setName}: +${b.weaponStatusCond}% Weapon & Status DMG (while shielded)`);
    if (b.weaponStatusStack) totals.notes.push(`${setName}: +${b.weaponStatusStack}% Weapon & Status DMG per stack (max 4)`);

    if (b.elemDmg) totals.elemDmg += b.elemDmg;
    if (b.elemDmgMax) totals.notes.push(`${setName}: up to +${b.elemDmgMax}% Elemental DMG (max stacks)`);
    if (b.elemDmgKill) totals.notes.push(`${setName}: +${b.elemDmgKill}% Elemental DMG after kill (decays)`);

    if (b.magCap) totals.magCap += b.magCap;
    if (b.reload) totals.reload += b.reload;
    if (b.maxHP) totals.maxHP += b.maxHP;
    if (b.dmgRed) totals.notes.push(`${setName}: +${b.dmgRed}% DMG Reduction per nearby enemy (max 4)`);
    if (b.statusRed) totals.notes.push(`${setName}: +${b.statusRed}% Status DMG Reduction`);
  });

  return totals;
}

function enforceOneKeyItem(changedSlot) {
  const slots = ["helmet","mask","top","gloves","pants","shoes"];
  let keyCount = 0;
  let firstKeySlot = null;

  slots.forEach(slot => {
    const sel = document.getElementById(slot);
    const set = sel.options[sel.selectedIndex]?.dataset.set;
    if (set === "Key") {
      keyCount++;
      if (!firstKeySlot) firstKeySlot = slot;
    }
  });

  if (keyCount > 1) {
    // Keep only the most recently changed key item; reset the others
    slots.forEach(slot => {
      if (slot !== changedSlot) {
        const sel = document.getElementById(slot);
        const set = sel.options[sel.selectedIndex]?.dataset.set;
        if (set === "Key") {
          // Reset to first non-key option (or index 0)
          for (let i = 0; i < sel.options.length; i++) {
            if (sel.options[i].dataset.set !== "Key") {
              sel.selectedIndex = i;
              break;
            }
          }
        }
      }
    });

    // Show a brief notice
    const notice = document.getElementById("keyNotice") || (() => {
      const n = document.createElement("div");
      n.id = "keyNotice";
      n.style.cssText = "background:#3a2a1a;border:1px solid #e8b86d;color:#e8b86d;padding:8px 12px;margin:8px 0;border-radius:4px;font-size:0.85rem;";
      document.querySelector(".section").insertAdjacentElement("afterend", n);
      return n;
    })();
    notice.textContent = "Only one Key Armor piece can be equipped at a time. Previous key item was unequipped.";
    setTimeout(() => { if (notice) notice.remove(); }, 3500);
  }
}

function onSlotChange(slot) {
  enforceOneKeyItem(slot);
  updateBuild();
  showSlotConfig(slot);
}

// Per-slot configuration storage
const slotConfigs = {};

function saveSlotConfig(slot) {
  if (!slotConfigs[slot]) slotConfigs[slot] = {};
  const cfg = slotConfigs[slot];
  const modEl = document.getElementById("cfgMod");
  const levelEl = document.getElementById("cfgModLevel");
  const hideEl = document.getElementById("cfgHide");
  if (modEl) cfg.mod = modEl.value;
  if (levelEl) cfg.modLevel = parseInt(levelEl.value) || 0;
  if (hideEl) cfg.hide = hideEl.value;
  ["cfgSight","cfgMuzzle","cfgGrip","cfgMag"].forEach(id => {
    const el = document.getElementById(id);
    if (el) cfg[id.replace("cfg","").toLowerCase()] = el.value;
  });
  updateBuild();
}

  ["sight","muzzle","grip","mag"].forEach(k => {
    const el = document.getElementById("cfg" + k.charAt(0).toUpperCase() + k.slice(1));
    if (el && saved[k]) el.value = saved[k];
  });
}

function updateBuild() {
  const counts = getEquippedSets();
  const bonusesEl = document.getElementById("bonuses");
  bonusesEl.innerHTML = "";

  Object.keys(counts).forEach(setName => {
    const count = counts[setName];
    const set = sets[setName];
    if (!set) return;
    const active = set.bonuses.slice(0, Math.min(count, 4));
    if (active.length) {
      const div = document.createElement("div");
      div.className = "bonus";
      const rClass = rarityClass(set.rarity);
      div.innerHTML = `<strong class="${rClass}">${setName} (${count}pc) — ${set.rarity}</strong><br>` + active.join("<br>");
      bonusesEl.appendChild(div);
    }
  });

  // Totals panel
  const totals = calculateSetTotals(counts);
  window.currentTotals = totals;

  const totalsDiv = document.createElement("div");
  totalsDiv.className = "bonus";
  totalsDiv.style.borderLeftColor = "#00ff88";
  let totalsHTML = `<strong>Set Bonus Totals (Always-on / Base)</strong><br>`;
  const rows = [];
  if (totals.critRate) rows.push(`Crit Rate: <strong>+${totals.critRate}%</strong>`);
  if (totals.critDmg) rows.push(`Crit DMG: <strong>+${totals.critDmg}%</strong>`);
  if (totals.weakspot) rows.push(`Weakspot DMG: <strong>+${totals.weakspot}%</strong>`);
  if (totals.elemDmg) rows.push(`Elemental DMG: <strong>+${totals.elemDmg}%</strong>`);
  if (totals.magCap) rows.push(`Magazine Capacity: <strong>+${totals.magCap}%</strong>`);
  if (totals.reload) rows.push(`Reload Speed: <strong>+${totals.reload}%</strong>`);
  if (totals.maxHP) rows.push(`Max HP: <strong>+${totals.maxHP}%</strong>`);
  if (rows.length === 0) rows.push("No flat set bonuses active.");
  totalsHTML += rows.join(" • ") + "<br>";
  if (totals.notes.length) {
    totalsHTML += `<small style="color:#aaa;">Conditional / Max stacks: ${totals.notes.join(" | ")}</small>`;
  }
  totalsDiv.innerHTML = totalsHTML;
  bonusesEl.appendChild(totalsDiv);

  // Per-slot Mods + Accessories + Hides summary
  const modBonusEl = document.getElementById("modAccessBonus");
  if (modBonusEl) {
    let lines = [];

    ["helmet","mask","top","gloves","pants","shoes"].forEach(slot => {
      const cfg = slotConfigs[slot];
      if (!cfg) return;
      if (cfg.mod && cfg.mod !== "None" && cfg.modLevel > 0) {
        const mod = modTypes.find(m => m.name === cfg.mod);
        const rar = rarityFromModLevel(cfg.modLevel);
        lines.push(`<strong>${slot}:</strong> ${cfg.mod} (Lv ${cfg.modLevel} • ${rar})`);
      }
      if (cfg.hide && cfg.hide !== "None") {
        const h = hides.find(x => x.name === cfg.hide);
        if (h) lines.push(`<strong>${slot} Hide:</strong> ${h.name}`);
      }
    });

    ["weapon","weapon2"].forEach(slot => {
      const cfg = slotConfigs[slot];
      if (!cfg) return;
      const label = slot === "weapon" ? "Primary" : "Secondary";
      if (cfg.mod && cfg.mod !== "None" && cfg.modLevel > 0) {
        const rar = rarityFromModLevel(cfg.modLevel);
        lines.push(`<strong>${label} Mod:</strong> ${cfg.mod} (Lv ${cfg.modLevel} • ${rar})`);
      }
      const accs = [cfg.sight, cfg.muzzle, cfg.grip, cfg.mag].filter(a => a && a !== "None");
      if (accs.length) lines.push(`<strong>${label} Acc:</strong> ${accs.join(", ")}`);
    });

    modBonusEl.innerHTML = lines.length ? lines.join("<br>") : "<em>No mods, accessories, or hides selected.</em>";
  }

  const dpsNoDev = calculateDPS(null);
  const devSel = document.getElementById("combatDev");
  const devName = devSel.value;
  let dev = null;
  let dpsWithDev = dpsNoDev;
  const skill = parseInt(document.getElementById("devSkill").value) || 1;
  const tier = parseInt(document.getElementById("devTier").value) || 1;
  // Scale: 1/1 ≈ 40% of listed bonus, 5/5 = 100%
  const scale = 0.4 + (skill - 1) * 0.075 + (tier - 1) * 0.075;
  if (devName && devName !== "None") {
    dev = combatDeviations.find(d => d.name === devName);
    if (dev && dev.bonus) {
      const scaledBonus = { ...dev.bonus };
      if (scaledBonus.weakspot) scaledBonus.weakspot *= scale;
      if (scaledBonus.weaponDmg) scaledBonus.weaponDmg *= scale;
      if (scaledBonus.elemental) scaledBonus.elemental *= scale;
      dpsWithDev = calculateDPS(scaledBonus);
    }
  }

  const statsEl = document.getElementById("stats");
  statsEl.innerHTML = `
    <div class="stat-section">
      <div class="stat-row-label">Damage</div>
      <div class="stat-tiles">
        <div class="stat-box"><strong>${dpsNoDev.body} / ${dpsWithDev.body}</strong>Body Shot<br><small>No Dev / With Dev</small></div>
        <div class="stat-box" style="border-color:#e85a8c;"><strong style="color:#e85a8c;">${dpsNoDev.weakspot} / ${dpsWithDev.weakspot}</strong>Weakspot<br><small>No Dev / With Dev</small></div>
        <div class="stat-box" style="border-color:#e8b86d;"><strong style="color:#e8b86d;">${dpsNoDev.weakspotCrit} / ${dpsWithDev.weakspotCrit}</strong>Weakspot Crit<br><small>No Dev / With Dev</small></div>
        <div class="stat-box" style="border-color:#e85a8c;"><strong style="color:#e85a8c;">${dpsNoDev.expectedWS} / ${dpsWithDev.expectedWS}</strong>Expected Weakspot<br><small>No Dev / With Dev</small></div>
      </div>
    </div>
    <div class="stat-section">
      <div class="stat-row-label">Crit</div>
      <div class="stat-tiles">
        <div class="stat-box" style="border-color:#e8b86d;"><strong style="color:#e8b86d;">${totals.critRate || 0}%</strong>Crit Rate</div>
        <div class="stat-box" style="border-color:#e8b86d;"><strong style="color:#e8b86d;">${totals.critDmg || 0}%</strong>Crit Damage</div>
      </div>
    </div>
    <div class="stat-section">
      <div class="stat-row-label">Weakspot</div>
      <div class="stat-tiles">
        <div class="stat-box" style="border-color:#e85a8c;"><strong style="color:#e85a8c;">${totals.weakspot || 0}%</strong>Weakspot Damage</div>
      </div>
    </div>
    <div class="stat-section">
      <div class="stat-row-label">Elemental / Status</div>
      <div class="stat-tiles">
        <div class="stat-box" style="border-color:#4da6ff;"><strong style="color:#4da6ff;">${totals.elemDmg || 0}%</strong>Elemental Damage</div>
        <div class="stat-box" style="border-color:#6fbf73;"><strong style="color:#6fbf73;">${totals.statusDmg || 0}%</strong>Status Damage</div>
      </div>
    </div>
    <div class="stat-section">
      <div class="stat-row-label">Weapon / Other</div>
      <div class="stat-tiles">
        <div class="stat-box"><strong>${totals.weaponDmg || 0}%</strong>Weapon Damage</div>
      </div>
    </div>
  `;

  if (dev && dev.name !== "None") {
    const dDiv = document.createElement("div");
    dDiv.className = "bonus";
    dDiv.style.borderLeftColor = "#ffaa00";
    let bonusText = "";
    if (dev.bonus) {
      const scaledNote = dev.bonus.note ? ` (${Math.round(scale*100)}% strength at Skill ${skill} / Tier ${tier})` : "";
      bonusText = `<br><strong>Combat Bonus:</strong> ${dev.bonus.note || ""}${scaledNote}`;
    } else {
      bonusText = "<br><em>No direct damage multiplier (utility/healer).</em>";
    }
    dDiv.innerHTML = `<strong>Combat Deviation: ${dev.name}</strong> (${dev.role})${bonusText}<br>${dev.desc}<br><em>Acquire: ${dev.acquire}</em>`;
    bonusesEl.appendChild(dDiv);
  }

  // Populate Results tab
  const resultsEl = document.getElementById("resultsContent");
  if (resultsEl) {
    resultsEl.innerHTML = document.getElementById("bonuses").innerHTML + document.getElementById("stats").outerHTML;
  }
}

function renderDeviations() {
  const list = document.getElementById("deviationList");
  list.innerHTML = "";
  const rarityOrder = { "Legendary": 0, "Epic": 1, "Rare": 2, "Common": 3 };
  const sorted = combatDeviations.filter(d => d.name !== "None").sort((a, b) => {
    const ra = rarityOrder[a.rarity] ?? 5;
    const rb = rarityOrder[b.rarity] ?? 5;
    if (ra !== rb) return ra - rb;
    return a.name.localeCompare(b.name);
  });
  sorted.forEach(d => {
    const div = document.createElement("div");
    div.className = "deviation";
    div.dataset.role = d.role;
    div.style.cursor = "pointer";
    div.innerHTML = `
      <strong class="${rarityClass(d.rarity)}">${d.name}</strong> <span style="color:#aaa;">(${d.rarity} ${d.role})</span><br>
      <small>${d.desc}</small>
    `;
    div.onclick = () => {
      if (confirm(`Equip ${d.name}?`)) {
        document.getElementById("combatDev").value = d.name;
        updateBuild();
        document.querySelectorAll(".tabcontent").forEach(t => t.style.display = "none");
        document.getElementById("Results").style.display = "block";
        document.querySelectorAll(".tablinks").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tablinks")[3].classList.add("active");
      }
    };
    list.appendChild(div);
  });
}

function filterDeviations() {
  const q = document.getElementById("devSearch").value.toLowerCase();
  document.querySelectorAll("#deviationList .deviation").forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = text.includes(q) ? "" : "none";
  });
}

function renderSets() {
  const list = document.getElementById("setsList");
  list.innerHTML = "";
  const rarityOrder = { "Legendary": 0, "Epic": 1, "Rare": 2, "Common": 3 };
  const sortedNames = Object.keys(sets).sort((a, b) => {
    const ra = rarityOrder[sets[a].rarity] ?? 5;
    const rb = rarityOrder[sets[b].rarity] ?? 5;
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b);
  });
  sortedNames.forEach(name => {
    const s = sets[name];
    const div = document.createElement("div");
    div.className = "section";
    div.style.cursor = "pointer";
    div.innerHTML = `<h3><span class="${rarityClass(s.rarity)}">${name}</span> <span style="color:#aaa; font-size:0.8em;">(${s.rarity})</span></h3>` +
      s.bonuses.map(b => `<div class="bonus">${b}</div>`).join("");
    div.onclick = () => {
      if (confirm(`Equip ${name} set?`)) {
        ["helmet","mask","top","gloves","pants","shoes"].forEach(slot => {
          const pieces = slotPieces[slot] || [];
          const piece = pieces.find(p => p.set === name);
          if (piece) {
            const sel = document.getElementById(slot);
            for (let i = 0; i < sel.options.length; i++) {
              if (sel.options[i].value === piece.name) { sel.selectedIndex = i; break; }
            }
          }
        });
        updateBuild();
        document.querySelectorAll(".tabcontent").forEach(t => t.style.display = "none");
        document.getElementById("Results").style.display = "block";
        document.querySelectorAll(".tablinks").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tablinks")[3].classList.add("active");
      }
    };
    list.appendChild(div);
  });
}

function switchTab(name) {
  var contents = document.querySelectorAll(".tabcontent");
  for (var i = 0; i < contents.length; i++) {
    contents[i].style.display = "none";
  }
  var buttons = document.querySelectorAll(".tablinks");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].classList.remove("active");
  }
  var target = document.getElementById(name);
  if (target) target.style.display = "block";
  var btn = document.getElementById("btn" + name);
  if (btn) btn.classList.add("active");
}
window.switchTab = switchTab;
window.openTab = function(evt, name) { switchTab(name); };
function openTab(evt, name) { switchTab(name); }
document.addEventListener("click", function(e) {
  const btn = e.target.closest(".tablinks");
  if (btn) {
    const name = btn.getAttribute("data-tab") || btn.getAttribute("onclick")?.match(/'([^']+)'/)?.[1];
    if (name) openTab({currentTarget: btn}, name);
  }
});

try { populateSelects(); } catch(e) { console.error("populateSelects", e); }
try { renderDeviations(); } catch(e) { console.error("renderDeviations", e); }
try { renderSets(); } catch(e) { console.error("renderSets", e); }
try { updateBuild(); } catch(e) { console.error("updateBuild", e); }
// Safety re-run
setTimeout(() => { try { populateSelects(); updateBuild(); } catch(e) {} }, 100);
</script>
