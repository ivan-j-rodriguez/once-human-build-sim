<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Once Human</title>
<style>
:root { --bg:#07090d; --panel:#101820; --border:#1e2a38; --accent:#24C2C2; --gold:#e8b86d; --epic:#b07cff; --rare:#4da6ff; --common:#6fbf73; --text:#e8edf5; --dim:#8a96a8; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,-apple-system,sans-serif; background:#07090d; color:var(--text); padding:16px 12px 40px; }
.header { text-align:center; margin-bottom:18px; }
.logo { font-size:1.5rem; font-weight:900; letter-spacing:3px; color:var(--accent); }
.tabs { display:flex; gap:2px; margin-bottom:14px; border-bottom:1px solid #1a2530; }
.tablinks { background:transparent; border:none; color:var(--dim); padding:10px 14px; cursor:pointer; font-size:0.74rem; letter-spacing:1.2px; text-transform:uppercase; font-weight:600; border-bottom:2px solid transparent; }
.tablinks.active { color:var(--accent); border-bottom-color:var(--accent); }
.tabcontent { display:none; }
.slot-card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; margin:10px 0; }
.slot-card h3 { font-size:0.66rem; color:var(--accent); letter-spacing:2px; margin-bottom:8px; text-transform:uppercase; }
.field { margin:8px 0; }
label { font-size:0.58rem; color:var(--dim); display:block; margin-bottom:3px; letter-spacing:0.5px; text-transform:uppercase; }
select { background:#080c12; color:var(--text); border:1px solid #243040; padding:9px 10px; border-radius:6px; font-size:0.86rem; width:100%; }
.desc { font-size:0.7rem; color:#9ab4c8; margin-top:4px; line-height:1.35; }
.rarity-legendary { color:var(--gold); font-weight:600; }
.rarity-epic { color:var(--epic); font-weight:600; }
.rarity-rare { color:var(--rare); font-weight:600; }
.rarity-fine { color:#7ec8e3; }
.rarity-common { color:var(--common); }
.results { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tile { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; text-align:center; }
.tile .v { font-size:1.15rem; font-weight:700; color:var(--accent); }
.tile .l { font-size:0.62rem; color:var(--dim); margin-top:2px; }
.set-bonus { font-size:0.72rem; color:#b8c8d8; margin:3px 0; }
.equip { background:var(--accent); color:#041016; border:none; padding:7px 12px; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.75rem; margin-top:6px; }
.slot-row { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:10px 0; }
.slot-btn { background:#0c1218; border:1px solid #2a3a4a; color:var(--text); padding:8px 4px; border-radius:6px; font-size:0.68rem; cursor:pointer; text-align:center; }
.slot-btn:hover { border-color:var(--accent); }
.pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pair .field { margin:0; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; }
.modal.show { display:flex; }
.modal-box { background:#161e28; border:1px solid #2a3a4a; border-radius:12px; padding:18px; max-width:380px; width:90%; max-height:80vh; overflow-y:auto; }
.modal-box h2 { font-size:1.05rem; margin-bottom:4px; }
.modal-box .sub { font-size:0.75rem; color:var(--dim); margin-bottom:10px; }
.modal-box .locked { color:#e85a8a; font-size:0.8rem; margin:6px 0; }
.modal-box .core { background:#0e141c; padding:10px; border-radius:8px; margin:8px 0; font-size:0.82rem; }
.modal-box .suffix { background:#1a2430; padding:10px; border-radius:8px; margin:8px 0; }
.modal-box .note { color:#e8b86d; font-size:0.75rem; margin-top:10px; }
.modal-box button { margin-top:10px; }
.dev-card { display:flex; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; margin:8px 0; }
.dev-card img { width:48px; height:48px; object-fit:contain; background:#080c12; border-radius:6px; }
</style>
</head>
<body>
<div class="header"><img src="logo.png" alt="Once Human" style="height:64px;max-width:100%;object-fit:contain;"></div>
<div class="tabs">
  <button class="tablinks active" onclick="switchTab('Build')">Build</button>
  <button class="tablinks" onclick="switchTab('Deviations')">Deviations</button>
  <button class="tablinks" onclick="switchTab('Armor')">Armor</button>
  <button class="tablinks" onclick="switchTab('Results')">Results</button>

    </div>
    <div class="field"><label>Sight / Scope</label><select id="accSight" onchange="updateBuild()"><option value="">None</option><option>Red Dot</option><option>Holographic Sight</option><option>4x Scope</option><option>6x Scope</option><option>Advanced Sniper Sight</option><option>Thermal Scope</option><option>Compact Reflex</option></select></div>
    <div class="field"><label>Magazine</label><select id="accMag" onchange="updateBuild()"><option value="">None</option><option>Extended Mag</option><option>Amended Rifle Mag</option><option>Light Mag</option><option>Drum Mag</option><option>Quick Reload Mag</option></select></div>

    <div class="pair">
      <div class="field"><label>Tier</label><select id="w2Tier" onchange="updateBuild()"><option>I</option><option>II</option><option>III</option><option selected>IV</option><option>V</option></select></div>
      <div class="field"><label>Enhancement Level</label><select id="w2Enh" onchange="updateBuild()"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
    </div>
    <div class="field"><label>Sight / Scope</label><select id="acc2Sight" onchange="updateBuild()"><option value="">None</option><option>Red Dot</option><option>Holographic Sight</option><option>4x Scope</option><option>6x Scope</option></select></div>
    <div class="field"><label>Magazine</label><select id="acc2Mag" onchange="updateBuild()"><option value="">None</option><option>Extended Mag</option><option>Amended Rifle Mag</option></select></div>
    <div class="field"><label>Muzzle</label><select id="acc2Muzzle" onchange="updateBuild()"><option value="">None</option><option>Short Suppressor</option><option>Long Suppressor</option><option>Tactical Suppressor</option></select></div>
    <h3 style="font-size:0.85rem;margin-top:14px;">Melee Weapon</h3>
    <div class="field"><label>Weapon</label><select id="melee" onchange="updateBuild()"></select></div>
    <div class="pair">
      <div class="field"><label>Tier</label><select id="mTier" onchange="updateBuild()"><option>I</option><option>II</option><option>III</option><option selected>IV</option><option>V</option></select></div>

    </div>
  </div>
  <div id="armorSlots"></div>
</div>

<div id="Deviations" class="tabcontent"><div id="devList"></div></div>
<div id="Armor" class="tabcontent"><div id="setList"></div></div>
<div id="Results" class="tabcontent">

</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">

</div>

function switchTab(id) {

      const o = document.createElement("option"); o.value = h.name; o.textContent = h.name; o.className = "rarity-"+h.rarity.toLowerCase();

    let timer = null, startX = 0, startY = 0;
    div.oncontextmenu = (e) => { e.preventDefault(); showDevDetail(d); };
    div.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      timer = setTimeout(() => showDevDetail(d), 600);
    }, {passive:true});
    div.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) {
        clearTimeout(timer);
      }
    }, {passive:true});
    div.addEventListener("touchend", () => clearTimeout(timer));
    div.addEventListener("touchcancel", () => clearTimeout(timer));
    dlist.appendChild(div);
  });

  const slist = document.getElementById("setList");
  Object.keys(sets).forEach(name => {
    const s = sets[name];

      <div class="slot-row">${row}</div>` + s.bonuses.map(b=>`<div class="set-bonus">${b}</div>`).join("");
    slist.appendChild(div);
  });
}

function equipOne(setName, slot, idx) {
  const s = sets[setName];
  const piece = s.pieces[idx];
  const sel = document.getElementById(slot);
  for (let j=0; j<sel.options.length; j++) {
    if (sel.options[j].value === piece) { sel.selectedIndex = j; break; }
  }
  openModPopup(slot, piece);
  updateBuild();
}

function openModPopup(slot, piece) {
  const box = document.getElementById("modalBox");
  box.innerHTML = `<h2>Select Mod for ${piece}</h2><div class="sub">Choose a mod. Description shows before confirm.</div>
    <div id="modChoices"></div><button class="equip" onclick="closeModal()">Done</button>`;
  const choices = document.getElementById("modChoices");
  mods.filter(m => m.name !== "None").forEach(m => {
    const btn = document.createElement("div"); btn.style.cssText = "background:#0e141c;padding:10px;border-radius:8px;margin:6px 0;cursor:pointer;";
    btn.innerHTML = `<strong class="rarity-${m.rarity.toLowerCase()}">${m.name}</strong><div class="desc">${m.core}</div>`;
    btn.onclick = () => { document.getElementById(slot+"Mod").value = m.name; showModPreview(slot); closeModal(); updateBuild(); };
    choices.appendChild(btn);
  });
  document.getElementById("modal").classList.add("show");
}

function showModPreview(slot) {
  const name = document.getElementById(slot+"Mod").value;
  const m = mods.find(x => x.name === name);
  const el = document.getElementById(slot+"ModDesc");
  if (m && m.core) {
    el.innerHTML = m.core + (m.suffixes.length ? " <span style='color:#e8b86d'>[tap for full]</span>" : "");
    el.onclick = () => showModFull(m);
  } else el.textContent = "";
}

function showHidePreview(slot) {
  const name = document.getElementById(slot+"Hide").value;
  const h = hides.find(x => x.name === name);
  document.getElementById(slot+"HideDesc").textContent = h ? h.desc : "";
}

function showModFull(m) {

    <div class="core">${m.core}</div>${suffixes}
    <div class="note">Mod Level determines the number of active attributes, with all unlocked at Level 4 and above</div>
    <button class="equip" onclick="closeModal()">Close</button>`;
  document.getElementById("modal").classList.add("show");
}

function closeModal() { document.getElementById("modal").classList.remove("show"); }

function getSetCounts() {
  const counts = {};
  slots.forEach(slot => {
    const sel = document.getElementById(slot);
    if (sel && sel.value) {
      const opt = sel.options[sel.selectedIndex];
      const set = opt?.dataset?.set;
      if (set) counts[set] = (counts[set]||0) + 1;
    }
  });
  return counts;
}

function updateBuild() {
  // one key armor rule
  let keyCount = 0;
  slots.forEach(slot => {
    const sel = document.getElementById(slot);
    if (sel && sel.value) {
      const opt = sel.options[sel.selectedIndex];
      if (opt?.dataset?.key === "1") keyCount++;
    }
  });
  if (keyCount > 1) {
    alert("Only one Key Armor item can be equipped.");
    // reset the last changed key slot
    slots.forEach(slot => {
      const sel = document.getElementById(slot);
      if (sel && sel.value) {
        const opt = sel.options[sel.selectedIndex];
        if (opt?.dataset?.key === "1") { sel.value = ""; }
      }
    });
  }
  slots.forEach(slot => {
    showModPreview(slot);
    showHidePreview(slot);
  });
  const counts = getSetCounts();
  const rating = parseInt(document.getElementById("devRating")?.value || 5);
  const ratingMult = 1 + (rating - 1) * 0.15;

  let base = 1000;
  const primary = document.getElementById("primary")?.value;
  if (primary && weaponDetails[primary]) {
    const wd = weaponDetails[primary];
    base = (wd.dmg || 100) * (wd.fire || 300) / 60;
  }

  let crit = 5, weak = 15, elem = 0, weaponDmg = 0;
  Object.keys(counts).forEach(set => {
    const n = counts[set];
    if (set === "Lonewolf") { if (n>=1) crit += 3; if (n>=2) weaponDmg += 15; if (n>=3) crit += 6; if (n>=4) crit += 8; }
    if (set === "Falcon") { if (n>=2) crit += 12; if (n>=3) crit += 5; }
    if (set === "Renegade") { if (n>=1) weak += 8; if (n>=2) crit += 4; if (n>=3) weak += 15; }
    if (set === "Shelterer") { if (n>=2) elem += 8; if (n>=3) elem += 18; }
  });

  const dev = document.getElementById("deviation")?.value;
  if (dev === "Lonewolf's Whisper") {
    weaponDmg += 21.6 * ratingMult;
  }

  const dps = Math.round(base * (1 + weaponDmg/100) * (1 + crit/100) * (1 + weak/100) * (1 + elem/100) * ratingMult);
  const results = document.getElementById("results");
  results.innerHTML = `
    <div class="tile" oncontextmenu="event.preventDefault();showBreakdown('DPS',${dps},'Base × weapon × crit × weakspot × rating')"><div class="v">${dps}</div><div class="l">DPS Total</div></div>
    <div class="tile" oncontextmenu="event.preventDefault();showBreakdown('Crit',${crit},'From set bonuses')"><div class="v">${crit}%</div><div class="l">Crit</div></div>
    <div class="tile" oncontextmenu="event.preventDefault();showBreakdown('Weakspot',${weak},'From Renegade / other')"><div class="v">${weak}%</div><div class="l">Weakspot</div></div>
    <div class="tile"><div class="v">${elem}%</div><div class="l">Elemental</div></div>`;
  const out = document.getElementById("setBonusOut");
  out.innerHTML = Object.keys(counts).map(s => `<div class="set-bonus">${s}: ${counts[s]}pc</div>`).join("");
}

function showBreakdown(label, val, note) {
  alert(label + ": " + val + "\n" + note);
}

populate();
updateBuild();
</script>
</body>
