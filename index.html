<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Once Human</title>
<style>
:root { --bg:#07090d; --panel:#101820; --border:#1e2a38; --accent:#24C2C2; --gold:#e8b86d; --epic:#b07cff; --rare:#4da6ff; --common:#6fbf73; --text:#e8edf5; --dim:#8a96a8; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:system-ui,-apple-system,sans-serif; background:#07090d; color:var(--text); padding:16px 12px 40px; }
.header { text-align:center; margin-bottom:18px; }
.logo { font-size:1.5rem; font-weight:900; letter-spacing:3px; color:var(--accent); }
.tabs { display:flex; gap:2px; margin-bottom:14px; border-bottom:1px solid #1a2530; justify-content:center; flex-wrap:wrap; }
.tablinks { background:transparent; border:none; color:var(--dim); padding:10px 14px; cursor:pointer; font-size:0.74rem; letter-spacing:1.2px; text-transform:uppercase; font-weight:600; border-bottom:2px solid transparent; }
.tablinks.active { color:var(--accent); border-bottom-color:var(--accent); }
.tabcontent { display:none; }
.slot-card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; margin:10px 0; }
.slot-card h3 { font-size:0.66rem; color:var(--accent); letter-spacing:2px; margin-bottom:8px; text-transform:uppercase; }
.field { margin:8px 0; }
label { font-size:0.58rem; color:var(--dim); display:block; margin-bottom:3px; letter-spacing:0.5px; text-transform:uppercase; }
select { background:#080c12; color:var(--text); border:1px solid #243040; padding:9px 10px; border-radius:6px; font-size:0.86rem; width:100%; }
.desc { font-size:0.7rem; color:#9ab4c8; margin-top:4px; line-height:1.35; }
.rarity-legendary { color:var(--gold); font-weight:600; }
.rarity-epic { color:var(--epic); font-weight:600; }
.rarity-rare { color:var(--rare); font-weight:600; }
.rarity-fine { color:#7ec8e3; }
.rarity-common { color:var(--common); }
.results { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tile { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; text-align:center; }
.tile .v { font-size:1.15rem; font-weight:700; }
.tile.weapon { border-color:#4fc3f7; } .tile.weapon .v { color:#4fc3f7; }
.tile.crit { border-color:#ffca28; } .tile.crit .v { color:#ffca28; }
.tile.critdmg { border-color:#ffab40; } .tile.critdmg .v { color:#ffab40; }
.tile.weak { border-color:#f48fb1; } .tile.weak .v { color:#f48fb1; }
.tile.status { border-color:#ab47bc; } .tile.status .v { color:#ab47bc; }
.tile.elem { border-color:#66bb6a; } .tile.elem .v { color:#66bb6a; }
.tile.dps { border-color:#29b6f6; } .tile.dps .v { color:#29b6f6; }
.tile .l { font-size:0.62rem; color:var(--dim); margin-top:2px; }

.gear-layout { display:flex; flex-direction:column; gap:14px; margin-bottom:14px; }
.section-header { font-size:0.85rem; color:#c8d8e8; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.section-header::before { content:""; width:3px; height:14px; background:#6cf; border-radius:1px; }
.weapon-row { display:grid; grid-template-columns:1fr 1fr 0.7fr; gap:8px; }
.gear-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.slot-tile, .tile, .dev-card, .modal-item { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.slot-tile { background:#121820; border:1px solid #2a3a50; border-radius:6px; padding:8px 4px; text-align:center; cursor:pointer; min-height:88px; display:flex; flex-direction:column; justify-content:flex-end; position:relative; }
.slot-tile:active { filter:brightness(1.15); }
.slot-tile .slot-num { position:absolute; top:4px; left:6px; font-size:0.7rem; color:#aaa; font-weight:600; }
.slot-tile .slot-name { font-size:0.6rem; color:#9ab; margin-top:4px; text-transform:uppercase; letter-spacing:0.5px; }
.slot-tile .indicators { position:absolute; bottom:4px; left:6px; display:flex; gap:3px; }
.slot-tile .ind { width:6px; height:6px; border-radius:1px; background:#334; }
.slot-tile .ind.on { background:#6cf; }
.slot-tile .slot-item { font-size:0.72rem; font-weight:600; color:#e8eef6; line-height:1.2; }
.slot-tile.empty { background:#121820; border-color:#2a3a50; }
.slot-tile.empty .slot-item { color:#556; font-weight:400; }
.slot-tile.melee { /* same height */ }

.slot-tile.rarity-common { background:linear-gradient(180deg,#2a2a2a 0%,#1a1a1a 100%); border-color:#555; }
.slot-tile.rarity-fine { background:linear-gradient(180deg,#1a2a3a 0%,#0e1a28 100%); border-color:#4a6a8a; }
.slot-tile.rarity-rare { background:linear-gradient(180deg,#1a2a4a 0%,#0e1a30 100%); border-color:#4a6aaa; }
.slot-tile.rarity-epic { background:linear-gradient(180deg,#2a1a40 0%,#1a0e28 100%); border-color:#6a4aaa; }
.slot-tile.rarity-legendary { background:linear-gradient(180deg,#3a2a10 0%,#2a1a08 100%); border-color:#aa8a40; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:1000; display:none; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal-box { background:#0e141c; border:1px solid #2a3a50; border-radius:10px; width:90%; max-width:420px; max-height:80vh; overflow:auto; padding:14px; }
.modal-box h3 { margin:0 0 10px; font-size:0.95rem; }
.modal-list { display:flex; flex-direction:column; gap:6px; }
.modal-item { padding:8px 10px; background:#161e28; border-radius:6px; cursor:pointer; font-size:0.8rem; }
.modal-item:hover { background:#1e2a38; }


.tile, .slot-card, .dev-card, select, button, .tablinks {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.tile { touch-action: manipulation; }

.set-bonus { font-size:0.72rem; color:#b8c8d8; margin:3px 0; }
.equip { background:var(--accent); color:#041016; border:none; padding:7px 12px; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.75rem; margin-top:6px; }
.slot-row { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:10px 0; }
.slot-btn { background:#0c1218; border:1px solid #2a3a4a; color:var(--text); padding:8px 4px; border-radius:6px; font-size:0.68rem; cursor:pointer; text-align:center; }
.slot-btn:hover { border-color:var(--accent); }
.pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pair .field { margin:0; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; }
.modal.show { display:flex; }
.modal-box { background:#161e28; border:1px solid #2a3a4a; border-radius:12px; padding:18px; max-width:380px; width:90%; max-height:80vh; overflow-y:auto; }
.modal-box h2 { font-size:1.05rem; margin-bottom:4px; }
.modal-box .sub { font-size:0.75rem; color:var(--dim); margin-bottom:10px; }
.modal-box .locked { color:#e85a8a; font-size:0.8rem; margin:6px 0; }
.modal-box .core { background:#0e141c; padding:10px; border-radius:8px; margin:8px 0; font-size:0.82rem; }
.modal-box .suffix { background:#1a2430; padding:10px; border-radius:8px; margin:8px 0; }
.modal-box .note { color:#e8b86d; font-size:0.75rem; margin-top:10px; }
.modal-box button { margin-top:10px; }
.dev-card { display:flex; align-items:center; gap:10px; padding:10px 12px; background:#121820; border:1px solid #2a3a50; border-radius:8px; margin-bottom:6px; }
.dev-card strong { white-space:nowrap !important; }
.dev-card strong { flex:0 0 auto; font-size:0.85rem; white-space:nowrap; display:block; }
.dev-card .desc { flex:1; font-size:0.65rem; color:#8aa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dev-card { display:flex; align-items:center; gap:8px;  display:flex; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; margin:8px 0; }
.dev-card img { width:48px; height:48px; object-fit:contain; background:#080c12; border-radius:6px; }
</style>
</head>
<body>
<div class="header"><img src="logo.png" alt="Once Human" style="height:64px;max-width:100%;object-fit:contain;"></div>
<div class="tabs">
  <button class="tablinks active" onclick="switchTab('Build', this)">Build</button>
  <button class="tablinks" onclick="switchTab('Deviations', this)">Deviations</button>
  <button class="tablinks" onclick="switchTab('Armor', this)">Armor</button>
  <button class="tablinks" onclick="switchTab('Results', this)">Results</button>
</div>

<div id="Build" class="tabcontent" style="display:block;">
  <div class="gear-layout">
    <div>
      <div class="section-header">Weapon</div>
      <div class="weapon-row">
        <div class="slot-tile empty" onclick="openSlotModal('weapon')" ontouchstart="weaponLongPressStart('weapon')" ontouchend="clearTimeout(window.wlp)"><div class="slot-num" id="weaponNum">—</div><div class="slot-item" id="weaponDisplay">None</div><div class="slot-name">Primary</div><div class="indicators"><div class="ind" id="weaponModInd"></div><div class="ind" id="weaponAccInd"></div></div></div>
        <div class="slot-tile empty" onclick="openSlotModal('weapon2')"><div class="slot-num" id="weapon2Num">—</div><div class="slot-item" id="weapon2Display">None</div><div class="slot-name">Secondary</div><div class="indicators"><div class="ind" id="weapon2ModInd"></div><div class="ind" id="weapon2AccInd"></div></div></div>
        <div class="slot-tile empty" onclick="openSlotModal('melee')"><div class="slot-num" id="meleeNum">—</div><div class="slot-item" id="meleeDisplay">None</div><div class="slot-name">Melee</div></div>
      </div>
    </div>
    <div>
      <div class="section-header">Gear</div>
      <div class="gear-grid">
        <div class="slot-tile empty" onclick="openSlotModal('helmet')" ontouchstart="slotLongPressStart('helmet')" ontouchend="clearTimeout(window.slp)"><div class="slot-num" id="helmetNum">—</div><div class="slot-item" id="helmetDisplay">None</div><div class="slot-name">Helmet</div><div class="indicators"><div class="ind" id="helmetModInd"></div></div></div>
        <div class="slot-tile empty" onclick="openSlotModal('mask')" ontouchstart="slotLongPressStart('mask')" ontouchend="clearTimeout(window.slp)"><div class="slot-num" id="maskNum">—</div><div class="slot-item" id="maskDisplay">None</div><div class="slot-name">Mask</div><div class="indicators"><div class="ind" id="maskModInd"></div></div></div>
        <div class="slot-tile empty" onclick="openSlotModal('gloves')" ontouchstart="slotLongPressStart('gloves')" ontouchend="clearTimeout(window.slp)"><div class="slot-num" id="glovesNum">—</div><div class="slot-item" id="glovesDisplay">None</div><div class="slot-name">Gloves</div><div class="indicators"><div class="ind" id="glovesModInd"></div></div></div>
        <div class="slot-tile empty" onclick="openSlotModal('shoes')" ontouchstart="slotLongPressStart('shoes')" ontouchend="clearTimeout(window.slp)"><div class="slot-num" id="shoesNum">—</div><div class="slot-item" id="shoesDisplay">None</div><div class="slot-name">Shoes</div><div class="indicators"><div class="ind" id="shoesModInd"></div></div></div>
        <div class="slot-tile empty" onclick="openSlotModal('top')" ontouchstart="slotLongPressStart('top')" ontouchend="clearTimeout(window.slp)"><div class="slot-num" id="topNum">—</div><div class="slot-item" id="topDisplay">None</div><div class="slot-name">Top</div><div class="indicators"><div class="ind" id="topModInd"></div></div></div>
        <div class="slot-tile empty" onclick="openSlotModal('bottom')" ontouchstart="slotLongPressStart('bottom')" ontouchend="clearTimeout(window.slp)"><div class="slot-num" id="bottomNum">—</div><div class="slot-item" id="bottomDisplay">None</div><div class="slot-name">Bottom</div><div class="indicators"><div class="ind" id="bottomModInd"></div></div></div>
      </div>
    </div>
  </div>

  <div class="slot-card">
    <h3 style="font-size:0.85rem;">Deviation</h3>
    <div class="field"><label>Deviation</label>
      <select id="deviation" onchange="updateBuild()"><option value="">None</option></select>
    </div>
    <div class="pair">
      <div class="field"><label>Skill Rating</label>
        <select id="devSkill" onchange="updateBuild()"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option></select>
      </div>
      <div class="field"><label>Ability Rating</label>
        <select id="devAbility" onchange="updateBuild()"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option></select>
      </div>
    </div>
  </div>

  <div class="slot-card">
    <h3 style="font-size:0.85rem;">Cradle Overrides</h3>
    <div id="cradleBox" onclick="openCradlePicker()" style="width:100%;min-height:60px;background:#080c12;color:var(--text);border:1px solid #243040;padding:8px;border-radius:6px;cursor:pointer;font-size:0.75rem;">None selected</div>
<select id="cradleSelect" multiple style="display:none;"></select>
    <div id="cradlePreview" class="desc" style="margin-top:6px;">Selected overrides apply their effects to the calculation.</div>
  </div>

  <!-- Hidden selects kept for calculation compatibility -->
  <div style="display:none;">
    <select id="weapon"></select><select id="wTier"><option>IV</option></select><select id="wEnh"><option>4</option></select>
    <select id="weapon2"></select><select id="w2Tier"><option>IV</option></select><select id="w2Enh"><option>4</option></select>
    <select id="melee"></select><select id="mTier"><option>IV</option></select><select id="mEnh"><option>4</option></select>
    <select id="helmet"></select><select id="mask"></select><select id="top"></select>
    <select id="gloves"></select><select id="bottom"></select><select id="shoes"></select>
  </div>
</div>

<div id="slotModal" class="modal-overlay" onclick="if(event.target===this)closeSlotModal()" style="pointer-events:auto;">
  <div class="modal-box">
    <h3 id="modalTitle">Select</h3>
    <div id="modalList" class="modal-list"></div>
    <button onclick="closeSlotModal()" style="margin-top:10px;width:100%;padding:8px;background:#1a2430;border:1px solid #2a3a50;border-radius:6px;color:#ccc;">Close</button>
  </div>
</div>

<div id="Deviations" class="tabcontent"><div id="deviationList"></div><div id="devList"></div></div>
<div id="Armor" class="tabcontent"><div id="setsList"></div><div id="setList"></div></div>
<div id="Results" class="tabcontent">
  <div class="results" id="results"></div>
  <div id="setBonusOut" style="margin-top:12px;"></div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

const rarityOrder = { "Common": 0, "Fine": 1, "Rare": 2, "Epic": 3, "Legendary": 4 };
function sortByRarity(arr) {
  return arr.slice().sort((a, b) => {
    const ra = rarityOrder[a.rarity] ?? 99;
    const rb = rarityOrder[b.rarity] ?? 99;
    if (ra !== rb) return ra - rb;
    return (a.name || "").localeCompare(b.name || "");
  });
}

function selectSlotItem(name) {
  const sel = document.getElementById(currentModalSlot);
  if (sel) {
    let opt = Array.from(sel.options).find(o => o.value === name);
    if (!opt && name) {
      opt = document.createElement("option");
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    }
    sel.value = name || "";
  }
  const disp = document.getElementById(currentModalSlot + "Display");
  if (disp) disp.textContent = name || "None";
  // Apply rarity color to the tile
  const tile = document.querySelector(`.slot-tile[onclick*="${currentModalSlot}"]`);
  if (tile) {
    tile.classList.remove("rarity-common","rarity-fine","rarity-rare","rarity-epic","rarity-legendary","empty");
    if (!name) { tile.classList.add("empty"); }
    else {
      let rarity = "common";
      if (currentModalSlot === "weapon" || currentModalSlot === "weapon2") {
        const w = weapons.find(x => x.name === name);
        if (w) rarity = (w.rarity || "common").toLowerCase();
      } else if (currentModalSlot === "melee") {
        const w = meleeWeapons.find(x => x.name === name);
        if (w) rarity = (w.rarity || "common").toLowerCase();
      } else {
        // armor - find set rarity
        Object.keys(sets).forEach(setName => {
          if (sets[setName].pieces.includes(name)) rarity = (sets[setName].rarity || "common").toLowerCase();
        });
      }
      tile.classList.add("rarity-" + rarity);
    }
  }
  const slot = currentModalSlot;
  closeSlotModal();
  updateBuild();
  if (["helmet","mask","top","bottom","gloves","shoes"].includes(slot) && name) {
    setTimeout(() => openModModal(slot), 80);
  }
  if (["weapon","weapon2"].includes(slot) && name) {
    setTimeout(() => openModModal(slot), 80);
  }
}

function equipPiece(setName, slot, piece) {
  window._userAction = true;
  window._selectedSlots = window._selectedSlots || {};
  window._selectedSlots[slot] = setName + "|" + piece;
  document.querySelectorAll(".slot-btn").forEach(b => b.style.borderColor = "");
  Object.keys(window._selectedSlots).forEach(s => {
    const [sn, p] = window._selectedSlots[s].split("|");
    document.querySelectorAll(`[onclick*="equipPiece('${sn}','${s}'"]`).forEach(b => b.style.borderColor = "#6cf");
  });
  if (!piece) return;
  const sel = document.getElementById(slot);
  if (sel) {
    let opt = Array.from(sel.options).find(o => o.value === piece);
    if (!opt) {
      opt = document.createElement("option");
      opt.value = piece; opt.textContent = piece;
      sel.appendChild(opt);
    }
    sel.value = piece;
  }
  const disp = document.getElementById(slot + "Display");
  if (disp) disp.textContent = piece;
  const tile = document.querySelector(`.slot-tile[onclick*="${slot}"]`);
  if (tile) {
    tile.classList.remove("empty","rarity-common","rarity-fine","rarity-rare","rarity-epic","rarity-legendary");
    const r = (sets[setName]?.rarity || "common").toLowerCase();
    tile.classList.add("rarity-" + r);
  }
  // Open mod selection for that slot
  openModModal(slot);
  updateBuild();
}

function toggleCradle(name) {
  const sel = document.getElementById("cradleSelect");
  if (!sel) return;
  let opt = Array.from(sel.options).find(o => o.value === name);
  if (!opt) { opt = document.createElement("option"); opt.value = name; opt.textContent = name; sel.appendChild(opt); }
  const current = Array.from(sel.selectedOptions);
  if (!opt.selected && current.length >= 8) { alert("Maximum 8 cradle overrides."); return; }
  opt.selected = !opt.selected;
  const selected = Array.from(sel.selectedOptions).map(o => o.value);
  document.getElementById("cradleBox").innerHTML = selected.length ? selected.join("<br>") : "None selected";
  updateBuild();
  openCradlePicker();
}

  const sel = document.getElementById("cradleSelect");

  sel.innerHTML = "";
  cradleOverrides.forEach(c => {
    const o = document.createElement("option");
    o.value = c.name;
    o.textContent = c.name;
    sel.appendChild(o);
  });
}

function getSetCounts() {
  const counts = {};
  slots.forEach(slot => {
    const sel = document.getElementById(slot);
    if (sel && sel.value) {
      const opt = sel.options[sel.selectedIndex];
      const set = opt?.dataset?.set;
      if (set) counts[set] = (counts[set]||0) + 1;
    }
  });
  return counts;
}

function updateBuild() {
  // one key armor rule
  let keyCount = 0;
  slots.forEach(slot => {
    const sel = document.getElementById(slot);
    if (sel && sel.value) {
      const opt = sel.options[sel.selectedIndex];
      if (opt?.dataset?.key === "1") keyCount++;
    }
  });
  if (keyCount > 1 && window._userAction === true) {
    alert("Only one Key Armor item can be equipped.");
    slots.forEach(slot => {
      const sel = document.getElementById(slot);
      if (sel && sel.value) {
        const opt = sel.options[sel.selectedIndex];
        if (opt?.dataset?.key === "1") { sel.value = ""; }
      }
    });
  }
  slots.forEach(slot => {
    showModPreview(slot);
    showHidePreview(slot);
  });
  const counts = getSetCounts();
  const skill = parseInt(document.getElementById("devSkill")?.value || 5);
  const ability = parseInt(document.getElementById("devAbility")?.value || 5);
  const skillMult = 1 + (skill - 1) * 0.12;
  const abilityMult = 1 + (ability - 1) * 0.08;

  // Cradle overrides (selectable)
  let cWeapon = 0, cWeak = 0, cStatus = 0, cVsBoss = 0;
  const cradleSel = document.getElementById("cradleSelect");
  if (cradleSel && cradleSel.options.length === 0) {
    cradleOverrides.forEach(c => {
      const o = document.createElement("option");
      o.value = c.name;
      o.textContent = c.name;
      cradleSel.appendChild(o);
    });
  }
  const selected = cradleSel ? Array.from(cradleSel.selectedOptions).map(o => o.value) : [];
  selected.forEach(id => {
    if (id === "auto" || id === "long" || id === "hand" || id === "melee") cWeapon += 20;
    if (id === "tactical") cWeapon += 25;
    if (id === "steady") cWeak += 40;
    if (id === "devmaster") cVsBoss += 50;
    if (id === "status") cStatus += 25;
    if (id === "first") cStatus += 25;
    if (id === "bounty") { cWeapon += 25; cWeak += 35; }
  });
  // Preview
  const prev = document.getElementById("cradlePreview");
  if (prev) prev.textContent = "";

  let base = 1000;
  const primary = document.getElementById("weapon")?.value;
  let fireRate = 300;
  if (primary && weaponDetails[primary]) {
    const wd = weaponDetails[primary];
    base = wd.dmg || 100;
    fireRate = wd.fire || 300;
  }
  // Simple tier/enhancement scaling (structured, not perfect)
  const tier = document.getElementById("wTier")?.value || "IV";
  const enh = parseInt(document.getElementById("wEnh")?.value || 4);
  const tierMult = {I:0.7, II:0.8, III:0.9, IV:1.0, V:1.15}[tier] || 1;
  const enhMult = 1 + (enh - 1) * 0.06;
  base = base * tierMult * enhMult * (fireRate / 60);

  // Track sources for breakdowns
  const sources = {
    weaponDmg: [], crit: [], critDmg: [], weak: [], status: [], elem: []
  };
  let weaponDmg = 0 + cWeapon, crit = 5, critDmg = 0, weak = 15 + cWeak, status = 0 + cStatus, elem = 0;
  if (cWeapon) { sources.weaponDmg.push("Cradle: +" + cWeapon + "%"); weaponDmg += cWeapon; }
  if (cWeak) { sources.weak.push("Cradle: +" + cWeak + "%"); weak += cWeak; }
  if (cStatus) { sources.status.push("Cradle: +" + cStatus + "%"); status += cStatus; }
  sources.crit.push("Base: 5%");
  sources.weak.push("Base: 15%");

  Object.keys(counts).forEach(set => {
    const n = counts[set];
    if (set === "Lonewolf") {
      if (n>=1) { crit += 3; sources.crit.push("Lonewolf 1pc: +3% Crit"); }
      if (n>=2) { weaponDmg += 15; sources.weaponDmg.push("Lonewolf 2pc: +15% Weapon DMG"); }
      if (n>=3) { crit += 6; sources.crit.push("Lonewolf 3pc: +6% Crit"); }
      if (n>=4) { crit += 8; sources.crit.push("Lonewolf 4pc: +8% Crit"); }
    }
    if (set === "Falcon") {
      if (n>=2) { critDmg += 12; sources.critDmg.push("Falcon 2pc: +12% Crit DMG"); }
      if (n>=3) { crit += 5; sources.crit.push("Falcon 3pc: +5% Crit"); }
    }
    if (set === "Renegade") {
      if (n>=1) { weak += 8; sources.weak.push("Renegade 1pc: +8% Weakspot"); }
      if (n>=2) { crit += 4; sources.crit.push("Renegade 2pc: +4% Crit"); }
      if (n>=3) { weak += 15; sources.weak.push("Renegade 3pc: +15% Weakspot"); }
    }
    if (set === "Shelterer") {
      if (n>=2) { elem += 8; sources.elem.push("Shelterer 2pc: +8% Elemental"); }
      if (n>=3) { elem += 18; sources.elem.push("Shelterer 3pc: +18% Elemental"); }
    }
    if (set === "Agent") {
      if (n>=2) { weak += 10; sources.weak.push("Agent 2pc: +10% Weakspot"); }
      if (n>=3) { weak += 15; sources.weak.push("Agent 3pc: +15% Weakspot (stacks)"); }
    }
    if (set === "Heavy Duty") {
      if (n>=2) { weaponDmg += 10; sources.weaponDmg.push("Heavy Duty 2pc: +10% Weapon DMG"); }
    }
  });

  slots.forEach(slot => {
    const modName = document.getElementById(slot + "Mod")?.value;
    if (!modName) return;
    const m = mods.find(x => x.name === modName);
    if (!m) return;
    if (m.name === "Bullet Siphon") { weaponDmg += 5; sources.weaponDmg.push(modName + ": +5%"); }
    if (m.name === "Crit Amplifier") { critDmg += 30; sources.critDmg.push(modName + ": +30%"); }
    if (m.name === "Power of Striving") { weaponDmg += 10; sources.weaponDmg.push(modName + ": +10%"); }
  });

  const dev = document.getElementById("deviation")?.value;
  if (dev === "Lonewolf's Whisper") {
    const bonus = 21.6 * skillMult * abilityMult;
    weaponDmg += bonus;
    sources.weaponDmg.push(dev + " (skill/ability): +" + bonus.toFixed(1) + "%");
  }
  if (dev === "Zapamander") {
    elem += 15 * skillMult;
    sources.elem.push(dev + ": +" + (15*skillMult).toFixed(1) + "% Elemental");
  }
  if (dev === "Snowsprite") {
    elem += 10 * skillMult;
    sources.elem.push(dev + ": +" + (10*skillMult).toFixed(1) + "% Frost");
  }

  const dps = Math.round(base * (1 + weaponDmg/100) * (1 + crit/100) * (1 + weak/100) * (1 + elem/100) * (1 + status/100) * skillMult * abilityMult);

  function tile(cls, label, val, unit, srcKey) {
    const note = (sources[srcKey] || []).join("\n") || "Base / no additional sources";
    return `<div class="tile ${cls}" data-label="${label}" data-val="${val}" data-note="${(note||'').replace(/\"/g,'"')}"><div class="v">${val}${unit}</div><div class="l">${label}</div></div>`;
  }

  const results = document.getElementById("results");
  if (results) results.innerHTML = 
    tile("dps","DPS Total",dps,"","") +
    tile("weapon","Weapon DMG",weaponDmg,"%","weaponDmg") +
    tile("crit","Crit Rate",crit,"%","crit") +
    tile("critdmg","Crit DMG",critDmg,"%","critDmg") +
    tile("weak","Weakspot DMG",weak,"%","weak") +
    tile("status","Status DMG",status,"%","status") +
    tile("elem","Elemental DMG",elem,"%","elem");
  document.querySelectorAll("#results .tile").forEach(tile => {
  const note = tile.dataset.note || "Base value";
  tile.ontouchstart = (e) => { e.preventDefault(); window.rtp = setTimeout(() => alert(tile.dataset.label + ": " + tile.dataset.val + "\n\n" + note), 500); };
  tile.ontouchend = () => clearTimeout(window.rtp);
  tile.ontouchcancel = () => clearTimeout(window.rtp);
  tile.oncontextmenu = (e) => { e.preventDefault(); alert(tile.dataset.label + ": " + tile.dataset.val + "\n\n" + note); };
});
  const out = document.getElementById("setBonusOut");
  if (out) out.innerHTML = "";
}

function attachLongPress(el, fn) {
  let t = null, sx = 0, sy = 0;
  el.addEventListener("touchstart", (e) => {
    const p = e.touches[0]; sx = p.clientX; sy = p.clientY;
    t = setTimeout(fn, 550);
  }, {passive:true});
  el.addEventListener("touchmove", (e) => {
    const p = e.touches[0];
    if (Math.abs(p.clientX - sx) > 12 || Math.abs(p.clientY - sy) > 12) clearTimeout(t);
  }, {passive:true});
  el.addEventListener("touchend", () => clearTimeout(t));
  el.addEventListener("touchcancel", () => clearTimeout(t));
  el.addEventListener("contextmenu", (e) => { e.preventDefault(); fn(); });
}

}

  }
})();
// Ensure Results has tiles on first load
if (typeof updateBuild === "function") {
  try { updateBuild(); } catch(e) { console.error("updateBuild", e); }
}
</script>
